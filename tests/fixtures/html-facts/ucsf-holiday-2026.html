            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>UCSF Fitness and Recreation Centers are observing the 2026 holiday schedule listed below:</p><p><strong>Regular Hours</strong><br>Monday-Friday 6:00 am-9:00 pm (Bakar and Millberry)<br>Saturday-Sunday 8:00 am-6:00 pm (Bakar)<br>Saturday-Sunday 8:00 am-4:00 pm (Millberry)</p><p>&nbsp;<br><strong>January 1 (2026 New Year's Day): Closed</strong></p><p>January 19 (MLK Jr. Holiday): 8:00 am-2:00 pm</p><p>February 16 (Presidents Day): Open Regular Hours</p><p>March 27 (Cesar Chavez Holiday): Open Regular Hours</p><p><strong>May 25 (Memorial Day): Closed</strong></p><p>June 19 (Juneteenth): Open Regular Hours</p><p>July 3 (Independence Day UCSF recognized): 6:00 am-2:00 pm</p><p><strong>July 4 (Independence Day): Closed</strong></p><p><strong>September 7 (Labor Day): Closed</strong></p><p>November 11 (Veterans Day): Open Regular Hours</p><p><strong>November 26 (Thanksgiving Day): Closed</strong></p><p>November 27 (Post-Thanksgiving Day): 8:00 am-2:00 pm</p><p>December 21-23 (Winter Holiday): Open Regular Hours</p><p><strong>December 24 (Christmas Eve): Closed</strong></p><p><strong>December 25 (Christmas Day): Closed</strong></p><p>December 26-31 (Winter Holiday): 8:00 am-2:00 pm</p><p><strong>January 1 (2027 New Year's Day): Closed</strong><br><br>Note: Schedule is subject to change.</p></div>
