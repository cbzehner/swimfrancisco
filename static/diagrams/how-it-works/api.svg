<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="api-title api-desc">
  <title id="api-title">One request returns the whole board</title>
  <desc id="api-desc">A single GET /api/conditions reads one slug-keyed JSON record from KV and returns it. Every page on the site hydrates from this one fetch.</desc>
  <style>
    .b { fill: none; stroke: #f5c518; stroke-width: 1.5; }
    .t { fill: #f5c518; font-family: ui-monospace, "Share Tech Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.05em; }
    .tl { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; }
    .ts { font-size: 9.5px; opacity: 0.75; }
    .a { fill: none; stroke: #f5c518; stroke-width: 1.5; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5c518"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect class="b" x="40" y="60" width="120" height="44"/>
  <text class="t tl" x="100" y="86" text-anchor="middle">CLIENT</text>

  <!-- Endpoint -->
  <rect class="b" x="240" y="60" width="160" height="44"/>
  <text class="t tl" x="320" y="80" text-anchor="middle">GET</text>
  <text class="t ts" x="320" y="96" text-anchor="middle">/api/conditions</text>

  <line class="a" x1="160" y1="82" x2="240" y2="82"/>

  <!-- KV record -->
  <rect class="b" x="480" y="40" width="140" height="120"/>
  <text class="t tl" x="550" y="60" text-anchor="middle">KV: conditions</text>
  <line class="b" x1="480" y1="70" x2="620" y2="70"/>
  <text class="t ts" x="550" y="90" text-anchor="middle">aquatic-park: { … }</text>
  <text class="t ts" x="550" y="106" text-anchor="middle">baker-beach: { … }</text>
  <text class="t ts" x="550" y="122" text-anchor="middle">china-beach: { … }</text>
  <text class="t ts" x="550" y="138" text-anchor="middle">…</text>
  <text class="t ts" x="550" y="154" text-anchor="middle">14 spots total</text>

  <line class="a" x1="400" y1="82" x2="480" y2="82"/>
  <text class="t ts" x="440" y="76" text-anchor="middle">kv.get</text>

  <!-- Footer callout -->
  <text class="t ts" x="320" y="190" text-anchor="middle">1 REQUEST · 1 KV READ · ~6 KB · EDGE-CACHED 15 MIN</text>
</svg>
