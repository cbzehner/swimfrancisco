<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="pdf-title pdf-desc">
  <title id="pdf-title">LLM PDF extraction pipeline</title>
  <desc id="pdf-desc">PDF flows through SHA cache to a reviewed-snapshot lock check. Matched SHAs fast-path to content. Otherwise the LLM extracts; grounding flags suspect rows; catastrophic validation can refuse outright; everything else lands as a review candidate that a human approves before content/spots is touched.</desc>
  <style>
    .b { fill: none; stroke: #f5c518; stroke-width: 1.5; }
    .t { fill: #f5c518; font-family: ui-monospace, "Share Tech Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.05em; }
    .tl { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .ts { font-size: 9.5px; opacity: 0.78; }
    .a { fill: none; stroke: #f5c518; stroke-width: 1.5; marker-end: url(#arr); }
    .ax { fill: none; stroke: #f5c518; stroke-width: 1.2; stroke-dasharray: 5 3; opacity: 0.6; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5c518"/>
    </marker>
  </defs>

  <!-- PDF in -->
  <rect class="b" x="20" y="50" width="100" height="48"/>
  <text class="t tl" x="70" y="72" text-anchor="middle">PDF</text>
  <text class="t ts" x="70" y="88" text-anchor="middle">sfrecpark.org</text>

  <!-- SHA cache -->
  <rect class="b" x="150" y="50" width="120" height="48"/>
  <text class="t tl" x="210" y="72" text-anchor="middle">SHA CACHE</text>
  <text class="t ts" x="210" y="88" text-anchor="middle">data/&lt;slug&gt;/&lt;date&gt;-&lt;sha12&gt;</text>

  <line class="a" x1="120" y1="74" x2="150" y2="74"/>

  <!-- Reviewed lock check -->
  <rect class="b" x="300" y="50" width="140" height="48"/>
  <text class="t tl" x="370" y="72" text-anchor="middle">REVIEWED LOCK?</text>
  <text class="t ts" x="370" y="88" text-anchor="middle">reviewed.json by sha</text>

  <line class="a" x1="270" y1="74" x2="300" y2="74"/>

  <!-- Yes → fast path to content -->
  <line class="a" x1="440" y1="74" x2="620" y2="74"/>
  <text class="t ts" x="530" y="68" text-anchor="middle">yes · fast path</text>

  <!-- No → LLM extract -->
  <line class="a" x1="370" y1="98" x2="370" y2="130"/>
  <text class="t ts" x="382" y="118">no</text>

  <!-- LLM extract -->
  <rect class="b" x="260" y="130" width="220" height="48"/>
  <text class="t tl" x="370" y="152" text-anchor="middle">LLM EXTRACT</text>
  <text class="t ts" x="370" y="168" text-anchor="middle">anthropic | gemini · structured json</text>

  <!-- Grounding (advisory) -->
  <rect class="b" x="260" y="200" width="220" height="48"/>
  <text class="t tl" x="370" y="222" text-anchor="middle">GROUNDING</text>
  <text class="t ts" x="370" y="238" text-anchor="middle">advisory · flags suspect rows</text>

  <line class="a" x1="370" y1="178" x2="370" y2="200"/>

  <!-- Validation -->
  <rect class="b" x="260" y="270" width="220" height="48"/>
  <text class="t tl" x="370" y="292" text-anchor="middle">VALIDATION</text>
  <text class="t ts" x="370" y="308" text-anchor="middle">refuse if sessions → 0</text>

  <line class="a" x1="370" y1="248" x2="370" y2="270"/>

  <!-- Catastrophic refusal off-ramp -->
  <rect class="b" x="20" y="270" width="160" height="48"/>
  <text class="t tl" x="100" y="292" text-anchor="middle">REJECTED</text>
  <text class="t ts" x="100" y="308" text-anchor="middle">non-zero exit · no candidate</text>

  <line class="ax" x1="260" y1="294" x2="180" y2="294"/>
  <text class="t ts" x="220" y="288" text-anchor="middle">catastrophic</text>

  <!-- Review candidate -->
  <rect class="b" x="510" y="270" width="190" height="48"/>
  <text class="t tl" x="605" y="292" text-anchor="middle">REVIEW CANDIDATE</text>
  <text class="t ts" x="605" y="308" text-anchor="middle">artifacts + report · awaits human</text>

  <line class="a" x1="480" y1="294" x2="510" y2="294"/>

  <!-- Human review -->
  <rect class="b" x="510" y="200" width="190" height="48"/>
  <text class="t tl" x="605" y="222" text-anchor="middle">HUMAN REVIEW</text>
  <text class="t ts" x="605" y="238" text-anchor="middle">schedules review · reviewed.json</text>

  <line class="a" x1="605" y1="270" x2="605" y2="248"/>

  <!-- Content -->
  <rect class="b" x="540" y="50" width="160" height="48"/>
  <text class="t tl" x="620" y="72" text-anchor="middle">CONTENT/SPOTS</text>
  <text class="t ts" x="620" y="88" text-anchor="middle">md frontmatter · live</text>

  <line class="a" x1="605" y1="200" x2="605" y2="98"/>
</svg>
