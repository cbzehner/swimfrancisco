<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="pdf-title pdf-desc">
  <title id="pdf-title">LLM PDF extraction pipeline</title>
  <desc id="pdf-desc">PDF flows through SHA cache, LLM extraction, grounding check, validation gate, and reviewed-snapshot lock before being merged into content.</desc>
  <style>
    .b { fill: none; stroke: #f5c518; stroke-width: 1.5; }
    .t { fill: #f5c518; font-family: ui-monospace, "Share Tech Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.05em; }
    .tl { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .ts { font-size: 9.5px; opacity: 0.78; }
    .a { fill: none; stroke: #f5c518; stroke-width: 1.5; marker-end: url(#arr); }
    .ax { fill: none; stroke: #f5c518; stroke-width: 1.2; stroke-dasharray: 5 3; opacity: 0.6; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5c518"/>
    </marker>
  </defs>

  <!-- PDF in -->
  <rect class="b" x="20" y="50" width="100" height="48"/>
  <text class="t tl" x="70" y="72" text-anchor="middle">PDF</text>
  <text class="t ts" x="70" y="88" text-anchor="middle">sfrecpark.org</text>

  <!-- SHA cache -->
  <rect class="b" x="160" y="50" width="120" height="48"/>
  <text class="t tl" x="220" y="72" text-anchor="middle">SHA CACHE</text>
  <text class="t ts" x="220" y="88" text-anchor="middle">data/&lt;slug&gt;/&lt;date&gt;-&lt;sha12&gt;</text>

  <line class="a" x1="120" y1="74" x2="160" y2="74"/>

  <!-- Reviewed lock check -->
  <rect class="b" x="320" y="50" width="140" height="48"/>
  <text class="t tl" x="390" y="72" text-anchor="middle">REVIEWED LOCK?</text>
  <text class="t ts" x="390" y="88" text-anchor="middle">reviewed.json by sha</text>

  <line class="a" x1="280" y1="74" x2="320" y2="74"/>

  <!-- Yes → fast path to merge -->
  <line class="a" x1="460" y1="74" x2="540" y2="74"/>
  <line class="a" x1="540" y1="74" x2="540" y2="280"/>
  <text class="t ts" x="500" y="68" text-anchor="middle">yes</text>

  <!-- No → LLM -->
  <line class="a" x1="390" y1="98" x2="390" y2="130"/>
  <text class="t ts" x="402" y="118">no</text>

  <!-- LLM extract -->
  <rect class="b" x="280" y="130" width="220" height="48"/>
  <text class="t tl" x="390" y="152" text-anchor="middle">LLM EXTRACT</text>
  <text class="t ts" x="390" y="168" text-anchor="middle">anthropic | gemini · structured json</text>

  <!-- Grounding -->
  <rect class="b" x="280" y="200" width="220" height="48"/>
  <text class="t tl" x="390" y="222" text-anchor="middle">GROUNDING</text>
  <text class="t ts" x="390" y="238" text-anchor="middle">tokens-in-window evidence check</text>

  <line class="a" x1="390" y1="178" x2="390" y2="200"/>

  <!-- Validation -->
  <rect class="b" x="280" y="270" width="220" height="48"/>
  <text class="t tl" x="390" y="292" text-anchor="middle">VALIDATION</text>
  <text class="t ts" x="390" y="308" text-anchor="middle">refuse if sessions → 0</text>

  <line class="a" x1="390" y1="248" x2="390" y2="270"/>

  <!-- Refused branch -->
  <rect class="b" x="20" y="270" width="160" height="48"/>
  <text class="t tl" x="100" y="292" text-anchor="middle">REJECTED</text>
  <text class="t ts" x="100" y="308" text-anchor="middle">no write · alert operator</text>

  <line class="ax" x1="280" y1="294" x2="180" y2="294"/>
  <text class="t ts" x="225" y="288" text-anchor="middle">catastrophic</text>

  <!-- Merge -->
  <rect class="b" x="540" y="270" width="80" height="48"/>
  <text class="t tl" x="580" y="292" text-anchor="middle">MERGE</text>
  <text class="t ts" x="580" y="308" text-anchor="middle">content/spots</text>

  <line class="a" x1="500" y1="294" x2="540" y2="294"/>
</svg>
