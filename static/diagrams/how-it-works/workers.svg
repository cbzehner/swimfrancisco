<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="workers-title workers-desc">
  <title id="workers-title">Worker request lifecycle</title>
  <desc id="workers-desc">A single Worker has two entry points. fetch handles HTTP requests; scheduled handles cron ticks. Both touch KV; only scheduled touches NOAA and NDBC.</desc>
  <style>
    .b { fill: none; stroke: #f5c518; stroke-width: 1.5; }
    .t { fill: #f5c518; font-family: ui-monospace, "Share Tech Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.05em; }
    .tl { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .ts { font-size: 9.5px; opacity: 0.75; }
    .a { fill: none; stroke: #f5c518; stroke-width: 1.5; marker-end: url(#arr); }
    .ad { fill: none; stroke: #f5c518; stroke-width: 1.5; stroke-dasharray: 4 3; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5c518"/>
    </marker>
  </defs>

  <!-- Worker container -->
  <rect class="b" x="160" y="40" width="320" height="240"/>
  <text class="t tl" x="320" y="62" text-anchor="middle">CLOUDFLARE WORKER</text>
  <line class="b" x1="160" y1="72" x2="480" y2="72"/>

  <!-- fetch entry -->
  <rect class="b" x="180" y="92" width="140" height="40"/>
  <text class="t tl" x="250" y="116" text-anchor="middle">fetch(req, env)</text>

  <!-- scheduled entry -->
  <rect class="b" x="320" y="92" width="140" height="40"/>
  <text class="t tl" x="390" y="116" text-anchor="middle">scheduled(ev, env)</text>

  <!-- fetch routes -->
  <rect class="b" x="180" y="160" width="140" height="40"/>
  <text class="t ts" x="250" y="185" text-anchor="middle">/api/conditions</text>

  <rect class="b" x="180" y="218" width="140" height="40"/>
  <text class="t ts" x="250" y="236" text-anchor="middle">static assets</text>
  <text class="t ts" x="250" y="250" text-anchor="middle">(zola build)</text>

  <line class="a" x1="250" y1="132" x2="250" y2="160"/>
  <line class="a" x1="250" y1="200" x2="250" y2="218"/>

  <!-- scheduled branches -->
  <rect class="b" x="320" y="160" width="140" height="40"/>
  <text class="t ts" x="390" y="178" text-anchor="middle">classifyTick</text>
  <text class="t ts" x="390" y="192" text-anchor="middle">rebuild | refresh</text>

  <rect class="b" x="320" y="218" width="140" height="40"/>
  <text class="t ts" x="390" y="236" text-anchor="middle">assembleAndPersist</text>
  <text class="t ts" x="390" y="250" text-anchor="middle">noaa · ndbc → KV</text>

  <line class="a" x1="390" y1="132" x2="390" y2="160"/>
  <line class="a" x1="390" y1="200" x2="390" y2="218"/>

  <!-- HTTP in -->
  <rect class="b" x="20" y="100" width="120" height="32"/>
  <text class="t tl" x="80" y="120" text-anchor="middle">HTTP REQUEST</text>
  <line class="a" x1="140" y1="116" x2="180" y2="112"/>

  <!-- Cron in -->
  <rect class="b" x="20" y="100" width="120" height="32" transform="translate(0,140)"/>
  <text class="t tl" x="80" y="260" text-anchor="middle">CRON TICK</text>
  <line class="ad" x1="140" y1="256" x2="180" y2="240"/>
  <line class="ad" x1="180" y1="240" x2="320" y2="118"/>

  <!-- KV out -->
  <rect class="b" x="500" y="160" width="120" height="40"/>
  <text class="t tl" x="560" y="184" text-anchor="middle">KV</text>

  <line class="a" x1="320" y1="180" x2="500" y2="180"/>
  <text class="t ts" x="490" y="174" text-anchor="end">read</text>

  <line class="a" x1="460" y1="238" x2="500" y2="200"/>
  <text class="t ts" x="500" y="222">write</text>
</svg>
