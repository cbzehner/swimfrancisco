<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="day-title day-desc">
  <title id="day-title">Day rollover at 00:05 PT</title>
  <desc id="day-desc">Two daily crons cover PST and PDT so a rebuild fires at 00:05 Pacific year-round. The hourly cron at minute 0 keeps refreshing data alongside it.</desc>
  <style>
    .b { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .t { fill: currentColor; font-family: ui-monospace, "Share Tech Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.05em; }
    .tl { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .ts { font-size: 9.5px; opacity: 0.8; }
    .axis { stroke: currentColor; stroke-width: 1.5; }
    .tick { stroke: currentColor; stroke-width: 1; opacity: 0.55; }
    .mark-rebuild { stroke: currentColor; stroke-width: 2.5; }
    .mark-refresh { stroke: currentColor; stroke-width: 1.2; opacity: 0.5; stroke-dasharray: 2 2; }
  </style>

  <text class="t tl" x="20" y="28">CRON SCHEDULE · DAILY VIEW</text>

  <!-- PT axis -->
  <text class="t ts" x="20" y="68">PT</text>
  <line class="axis" x1="60" y1="80" x2="600" y2="80"/>
  <!-- 24 ticks -->
  <g>
    <line class="tick" x1="60" y1="76" x2="60" y2="84"/>
    <line class="tick" x1="82.5" y1="76" x2="82.5" y2="84"/>
    <line class="tick" x1="105" y1="76" x2="105" y2="84"/>
    <line class="tick" x1="127.5" y1="76" x2="127.5" y2="84"/>
    <line class="tick" x1="150" y1="76" x2="150" y2="84"/>
    <line class="tick" x1="172.5" y1="76" x2="172.5" y2="84"/>
    <line class="tick" x1="195" y1="74" x2="195" y2="86"/>
    <line class="tick" x1="217.5" y1="76" x2="217.5" y2="84"/>
    <line class="tick" x1="240" y1="76" x2="240" y2="84"/>
    <line class="tick" x1="262.5" y1="76" x2="262.5" y2="84"/>
    <line class="tick" x1="285" y1="76" x2="285" y2="84"/>
    <line class="tick" x1="307.5" y1="76" x2="307.5" y2="84"/>
    <line class="tick" x1="330" y1="74" x2="330" y2="86"/>
    <line class="tick" x1="352.5" y1="76" x2="352.5" y2="84"/>
    <line class="tick" x1="375" y1="76" x2="375" y2="84"/>
    <line class="tick" x1="397.5" y1="76" x2="397.5" y2="84"/>
    <line class="tick" x1="420" y1="76" x2="420" y2="84"/>
    <line class="tick" x1="442.5" y1="76" x2="442.5" y2="84"/>
    <line class="tick" x1="465" y1="74" x2="465" y2="86"/>
    <line class="tick" x1="487.5" y1="76" x2="487.5" y2="84"/>
    <line class="tick" x1="510" y1="76" x2="510" y2="84"/>
    <line class="tick" x1="532.5" y1="76" x2="532.5" y2="84"/>
    <line class="tick" x1="555" y1="76" x2="555" y2="84"/>
    <line class="tick" x1="577.5" y1="76" x2="577.5" y2="84"/>
    <line class="tick" x1="600" y1="76" x2="600" y2="84"/>
  </g>
  <text class="t ts" x="60" y="100" text-anchor="middle">00:00</text>
  <text class="t ts" x="195" y="100" text-anchor="middle">06</text>
  <text class="t ts" x="330" y="100" text-anchor="middle">12</text>
  <text class="t ts" x="465" y="100" text-anchor="middle">18</text>
  <text class="t ts" x="600" y="100" text-anchor="middle">24:00</text>

  <!-- Refresh marks (every hour, minute 0) -->
  <g>
    <line class="mark-refresh" x1="60" y1="55" x2="60" y2="76"/>
    <line class="mark-refresh" x1="82.5" y1="58" x2="82.5" y2="76"/>
    <line class="mark-refresh" x1="105" y1="58" x2="105" y2="76"/>
    <line class="mark-refresh" x1="127.5" y1="58" x2="127.5" y2="76"/>
    <line class="mark-refresh" x1="150" y1="58" x2="150" y2="76"/>
    <line class="mark-refresh" x1="172.5" y1="58" x2="172.5" y2="76"/>
    <line class="mark-refresh" x1="195" y1="58" x2="195" y2="76"/>
    <line class="mark-refresh" x1="217.5" y1="58" x2="217.5" y2="76"/>
    <line class="mark-refresh" x1="240" y1="58" x2="240" y2="76"/>
    <line class="mark-refresh" x1="262.5" y1="58" x2="262.5" y2="76"/>
    <line class="mark-refresh" x1="285" y1="58" x2="285" y2="76"/>
    <line class="mark-refresh" x1="307.5" y1="58" x2="307.5" y2="76"/>
    <line class="mark-refresh" x1="330" y1="58" x2="330" y2="76"/>
    <line class="mark-refresh" x1="352.5" y1="58" x2="352.5" y2="76"/>
    <line class="mark-refresh" x1="375" y1="58" x2="375" y2="76"/>
    <line class="mark-refresh" x1="397.5" y1="58" x2="397.5" y2="76"/>
    <line class="mark-refresh" x1="420" y1="58" x2="420" y2="76"/>
    <line class="mark-refresh" x1="442.5" y1="58" x2="442.5" y2="76"/>
    <line class="mark-refresh" x1="465" y1="58" x2="465" y2="76"/>
    <line class="mark-refresh" x1="487.5" y1="58" x2="487.5" y2="76"/>
    <line class="mark-refresh" x1="510" y1="58" x2="510" y2="76"/>
    <line class="mark-refresh" x1="532.5" y1="58" x2="532.5" y2="76"/>
    <line class="mark-refresh" x1="555" y1="58" x2="555" y2="76"/>
    <line class="mark-refresh" x1="577.5" y1="58" x2="577.5" y2="76"/>
  </g>

  <!-- Rebuild mark at PT 00:05 -->
  <g>
    <line class="mark-rebuild" x1="62" y1="40" x2="62" y2="76"/>
    <text class="t ts" x="68" y="42">00:05 REBUILD</text>
  </g>

  <!-- UTC axis below -->
  <text class="t ts" x="20" y="148">UTC</text>
  <line class="axis" x1="60" y1="160" x2="600" y2="160"/>
  <g>
    <line class="tick" x1="60" y1="156" x2="60" y2="164"/>
    <line class="tick" x1="195" y1="154" x2="195" y2="166"/>
    <line class="tick" x1="330" y1="154" x2="330" y2="166"/>
    <line class="tick" x1="465" y1="154" x2="465" y2="166"/>
    <line class="tick" x1="600" y1="156" x2="600" y2="164"/>
  </g>
  <text class="t ts" x="60" y="180" text-anchor="middle">offset by 7–8h</text>

  <!-- PDT cron (07:05 UTC) and PST cron (08:05 UTC) -->
  <g>
    <line class="mark-rebuild" x1="218" y1="140" x2="218" y2="160"/>
    <text class="t ts" x="222" y="138">5 7 * · PDT</text>
    <line class="mark-rebuild" x1="240" y1="140" x2="240" y2="160"/>
    <text class="t ts" x="244" y="152">5 8 * · PST</text>
  </g>

  <!-- Caption -->
  <text class="t ts" x="20" y="220">REFRESH (hourly · minute 0) · — REBUILD (00:05 PT · once a day)</text>
  <text class="t ts" x="20" y="236">classifyTick gates on PT hour 0 + UTC minute 5</text>
</svg>
