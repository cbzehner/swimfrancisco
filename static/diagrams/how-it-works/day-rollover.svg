<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="day-title day-desc">
  <title id="day-title">Day rollover at 00:00 PT</title>
  <desc id="day-desc">One hourly cron fires every UTC hour. On the tick that lands at 00:00 PT, the handler also triggers a rebuild. Intl handles DST inside the Worker.</desc>
  <style>
    .b { fill: none; stroke: #f5c518; stroke-width: 1.5; }
    .t { fill: #f5c518; font-family: ui-monospace, "Share Tech Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.05em; }
    .tl { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .ts { font-size: 9.5px; opacity: 0.8; }
    .axis { stroke: #f5c518; stroke-width: 1.5; }
    .tick { stroke: #f5c518; stroke-width: 1; opacity: 0.55; }
    .mark-rebuild { stroke: #f5c518; stroke-width: 2.5; }
    .mark-refresh { stroke: #f5c518; stroke-width: 1.2; opacity: 0.5; stroke-dasharray: 2 2; }
  </style>

  <text class="t tl" x="20" y="28">CRON SCHEDULE · DAILY VIEW</text>

  <!-- PT axis -->
  <text class="t ts" x="20" y="98">PT</text>
  <line class="axis" x1="60" y1="110" x2="600" y2="110"/>
  <!-- 24 ticks -->
  <g>
    <line class="tick" x1="60" y1="106" x2="60" y2="114"/>
    <line class="tick" x1="82.5" y1="106" x2="82.5" y2="114"/>
    <line class="tick" x1="105" y1="106" x2="105" y2="114"/>
    <line class="tick" x1="127.5" y1="106" x2="127.5" y2="114"/>
    <line class="tick" x1="150" y1="106" x2="150" y2="114"/>
    <line class="tick" x1="172.5" y1="106" x2="172.5" y2="114"/>
    <line class="tick" x1="195" y1="104" x2="195" y2="116"/>
    <line class="tick" x1="217.5" y1="106" x2="217.5" y2="114"/>
    <line class="tick" x1="240" y1="106" x2="240" y2="114"/>
    <line class="tick" x1="262.5" y1="106" x2="262.5" y2="114"/>
    <line class="tick" x1="285" y1="106" x2="285" y2="114"/>
    <line class="tick" x1="307.5" y1="106" x2="307.5" y2="114"/>
    <line class="tick" x1="330" y1="104" x2="330" y2="116"/>
    <line class="tick" x1="352.5" y1="106" x2="352.5" y2="114"/>
    <line class="tick" x1="375" y1="106" x2="375" y2="114"/>
    <line class="tick" x1="397.5" y1="106" x2="397.5" y2="114"/>
    <line class="tick" x1="420" y1="106" x2="420" y2="114"/>
    <line class="tick" x1="442.5" y1="106" x2="442.5" y2="114"/>
    <line class="tick" x1="465" y1="104" x2="465" y2="116"/>
    <line class="tick" x1="487.5" y1="106" x2="487.5" y2="114"/>
    <line class="tick" x1="510" y1="106" x2="510" y2="114"/>
    <line class="tick" x1="532.5" y1="106" x2="532.5" y2="114"/>
    <line class="tick" x1="555" y1="106" x2="555" y2="114"/>
    <line class="tick" x1="577.5" y1="106" x2="577.5" y2="114"/>
    <line class="tick" x1="600" y1="106" x2="600" y2="114"/>
  </g>
  <text class="t ts" x="60" y="130" text-anchor="middle">00:00</text>
  <text class="t ts" x="195" y="130" text-anchor="middle">06</text>
  <text class="t ts" x="330" y="130" text-anchor="middle">12</text>
  <text class="t ts" x="465" y="130" text-anchor="middle">18</text>
  <text class="t ts" x="600" y="130" text-anchor="middle">24:00</text>

  <!-- Refresh marks (every hour) -->
  <g>
    <line class="mark-refresh" x1="60" y1="80" x2="60" y2="106"/>
    <line class="mark-refresh" x1="82.5" y1="86" x2="82.5" y2="106"/>
    <line class="mark-refresh" x1="105" y1="86" x2="105" y2="106"/>
    <line class="mark-refresh" x1="127.5" y1="86" x2="127.5" y2="106"/>
    <line class="mark-refresh" x1="150" y1="86" x2="150" y2="106"/>
    <line class="mark-refresh" x1="172.5" y1="86" x2="172.5" y2="106"/>
    <line class="mark-refresh" x1="195" y1="86" x2="195" y2="106"/>
    <line class="mark-refresh" x1="217.5" y1="86" x2="217.5" y2="106"/>
    <line class="mark-refresh" x1="240" y1="86" x2="240" y2="106"/>
    <line class="mark-refresh" x1="262.5" y1="86" x2="262.5" y2="106"/>
    <line class="mark-refresh" x1="285" y1="86" x2="285" y2="106"/>
    <line class="mark-refresh" x1="307.5" y1="86" x2="307.5" y2="106"/>
    <line class="mark-refresh" x1="330" y1="86" x2="330" y2="106"/>
    <line class="mark-refresh" x1="352.5" y1="86" x2="352.5" y2="106"/>
    <line class="mark-refresh" x1="375" y1="86" x2="375" y2="106"/>
    <line class="mark-refresh" x1="397.5" y1="86" x2="397.5" y2="106"/>
    <line class="mark-refresh" x1="420" y1="86" x2="420" y2="106"/>
    <line class="mark-refresh" x1="442.5" y1="86" x2="442.5" y2="106"/>
    <line class="mark-refresh" x1="465" y1="86" x2="465" y2="106"/>
    <line class="mark-refresh" x1="487.5" y1="86" x2="487.5" y2="106"/>
    <line class="mark-refresh" x1="510" y1="86" x2="510" y2="106"/>
    <line class="mark-refresh" x1="532.5" y1="86" x2="532.5" y2="106"/>
    <line class="mark-refresh" x1="555" y1="86" x2="555" y2="106"/>
    <line class="mark-refresh" x1="577.5" y1="86" x2="577.5" y2="106"/>
  </g>

  <!-- Rebuild mark at PT 00:00 (overlays the same tick as refresh) -->
  <g>
    <line class="mark-rebuild" x1="60" y1="60" x2="60" y2="106"/>
    <text class="t ts" x="68" y="62">00:00 REFRESH + REBUILD</text>
  </g>

  <!-- Caption -->
  <text class="t ts" x="20" y="180">REFRESH (hourly · every tick) · — REBUILD (also fires at 00:00 PT)</text>
  <text class="t ts" x="20" y="196">isPtMidnight(scheduledTime) gates the rebuild · Intl handles PDT/PST</text>
</svg>
