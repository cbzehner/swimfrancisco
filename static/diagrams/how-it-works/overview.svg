<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="overview-title overview-desc">
  <title id="overview-title">Three paths through one Worker</title>
  <desc id="overview-desc">Three independent lanes feed one Cloudflare Worker: a build lane that compiles content into the deployed Worker, a cron lane that fetches NOAA/NDBC and writes one KV key, and a request lane that serves cached responses from KV.</desc>
  <style>
    .b { fill: none; stroke: #f5c518; stroke-width: 1.5; }
    .t { fill: #f5c518; font-family: ui-monospace, "Share Tech Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.05em; }
    .tl { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .ts { font-size: 9.5px; opacity: 0.78; }
    .a { fill: none; stroke: #f5c518; stroke-width: 1.5; marker-end: url(#arr); }
    .ad { stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5c518"/>
    </marker>
  </defs>

  <!-- Lane 1: BUILD -->
  <text class="t ts" x="20" y="22">BUILD · pre-deploy</text>
  <line class="b" x1="20" y1="28" x2="220" y2="28"/>

  <rect class="b" x="20" y="42" width="180" height="48"/>
  <text class="t tl" x="110" y="64" text-anchor="middle">SCHEDULE PIPELINE</text>
  <text class="t ts" x="110" y="80" text-anchor="middle">PDFs → LLM → content/</text>

  <rect class="b" x="260" y="42" width="180" height="48"/>
  <text class="t tl" x="350" y="64" text-anchor="middle">ZOLA BUILD</text>
  <text class="t ts" x="350" y="80" text-anchor="middle">static + worker assets</text>

  <rect class="b" x="500" y="42" width="200" height="48"/>
  <text class="t tl" x="600" y="64" text-anchor="middle">CLOUDFLARE WORKER</text>
  <text class="t ts" x="600" y="80" text-anchor="middle">deployed</text>

  <line class="a" x1="200" y1="66" x2="260" y2="66"/>
  <line class="a" x1="440" y1="66" x2="500" y2="66"/>
  <text class="t ts" x="470" y="60" text-anchor="middle">deploy</text>

  <!-- Lane 2: CRON -->
  <text class="t ts" x="20" y="132">CRON · hourly</text>
  <line class="b" x1="20" y1="138" x2="220" y2="138"/>

  <rect class="b" x="20" y="152" width="140" height="48"/>
  <text class="t tl" x="90" y="174" text-anchor="middle">HOURLY CRON</text>
  <text class="t ts" x="90" y="190" text-anchor="middle">0 * * * *</text>

  <rect class="b" x="200" y="152" width="160" height="48"/>
  <text class="t tl" x="280" y="174" text-anchor="middle">WORKER</text>
  <text class="t ts" x="280" y="190" text-anchor="middle">scheduled</text>

  <rect class="b" x="400" y="152" width="160" height="48"/>
  <text class="t tl" x="480" y="174" text-anchor="middle">NOAA · NDBC</text>
  <text class="t ts" x="480" y="190" text-anchor="middle">station fetch</text>

  <rect class="b" x="600" y="152" width="100" height="48"/>
  <text class="t tl" x="650" y="174" text-anchor="middle">KV</text>
  <text class="t ts" x="650" y="190" text-anchor="middle">conditions</text>

  <line class="a ad" x1="160" y1="176" x2="200" y2="176"/>
  <text class="t ts" x="180" y="170" text-anchor="middle">tick</text>
  <line class="a" x1="360" y1="176" x2="400" y2="176"/>
  <text class="t ts" x="380" y="170" text-anchor="middle">fetch</text>
  <line class="a" x1="560" y1="176" x2="600" y2="176"/>
  <text class="t ts" x="580" y="170" text-anchor="middle">write</text>

  <!-- Lane 3: REQUEST -->
  <text class="t ts" x="20" y="242">REQUEST · per visitor</text>
  <line class="b" x1="20" y1="248" x2="220" y2="248"/>

  <rect class="b" x="20" y="262" width="140" height="48"/>
  <text class="t tl" x="90" y="284" text-anchor="middle">BROWSER</text>
  <text class="t ts" x="90" y="300" text-anchor="middle">GET /</text>

  <rect class="b" x="200" y="262" width="160" height="48"/>
  <text class="t tl" x="280" y="284" text-anchor="middle">WORKER</text>
  <text class="t ts" x="280" y="300" text-anchor="middle">fetch · edge-cached</text>

  <rect class="b" x="400" y="262" width="160" height="48"/>
  <text class="t tl" x="480" y="284" text-anchor="middle">KV</text>
  <text class="t ts" x="480" y="300" text-anchor="middle">on cache miss</text>

  <line class="a" x1="160" y1="286" x2="200" y2="286"/>
  <text class="t ts" x="180" y="280" text-anchor="middle">GET</text>
  <line class="a" x1="360" y1="286" x2="400" y2="286"/>
  <text class="t ts" x="380" y="280" text-anchor="middle">read</text>
</svg>
