<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="overview-title overview-desc">
  <title id="overview-title">Full-system flow</title>
  <desc id="overview-desc">Build pipeline writes static assets; the Worker serves them on fetch; the cron writes KV on scheduled ticks; the schedule pipeline writes pool content into the build.</desc>
  <style>
    .b { fill: none; stroke: #f5c518; stroke-width: 1.5; }
    .t { fill: #f5c518; font-family: ui-monospace, "Share Tech Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.05em; }
    .tl { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .ts { font-size: 9.5px; opacity: 0.75; }
    .a { fill: none; stroke: #f5c518; stroke-width: 1.5; marker-end: url(#arr); }
    .ad { fill: none; stroke: #f5c518; stroke-width: 1.5; stroke-dasharray: 4 3; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5c518"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect class="b" x="20" y="120" width="120" height="40"/>
  <text class="t tl" x="80" y="145" text-anchor="middle">BROWSER</text>

  <!-- Worker -->
  <rect class="b" x="200" y="100" width="180" height="80"/>
  <text class="t tl" x="290" y="125" text-anchor="middle">CLOUDFLARE WORKER</text>
  <text class="t ts" x="290" y="142" text-anchor="middle">fetch · scheduled</text>
  <line class="b" x1="200" y1="155" x2="380" y2="155"/>
  <text class="t ts" x="290" y="170" text-anchor="middle">serves static + /api/conditions</text>

  <!-- KV -->
  <rect class="b" x="440" y="100" width="160" height="50"/>
  <text class="t tl" x="520" y="123" text-anchor="middle">KV</text>
  <text class="t ts" x="520" y="140" text-anchor="middle">conditions:&lt;slug&gt; · all</text>

  <!-- NOAA / NDBC -->
  <rect class="b" x="440" y="170" width="160" height="40"/>
  <text class="t tl" x="520" y="194" text-anchor="middle">NOAA · NDBC</text>

  <!-- Build -->
  <rect class="b" x="200" y="20" width="180" height="40"/>
  <text class="t tl" x="290" y="45" text-anchor="middle">ZOLA BUILD</text>

  <!-- Schedule pipeline -->
  <rect class="b" x="20" y="20" width="160" height="40"/>
  <text class="t tl" x="100" y="40" text-anchor="middle">SCHEDULE PIPELINE</text>
  <text class="t ts" x="100" y="54" text-anchor="middle">PDFs → LLM → content/</text>

  <!-- Cron -->
  <rect class="b" x="20" y="220" width="160" height="40"/>
  <text class="t tl" x="100" y="245" text-anchor="middle">HOURLY CRON</text>

  <!-- Arrows -->
  <line class="a" x1="140" y1="140" x2="200" y2="140"/>
  <text class="t ts" x="170" y="134" text-anchor="middle">GET</text>

  <line class="a" x1="380" y1="125" x2="440" y2="125"/>
  <text class="t ts" x="410" y="118" text-anchor="middle">read</text>

  <line class="ad" x1="180" y1="240" x2="290" y2="240"/>
  <line class="ad" x1="290" y1="240" x2="290" y2="180"/>
  <text class="t ts" x="240" y="234" text-anchor="middle">tick</text>

  <line class="a" x1="380" y1="155" x2="440" y2="190"/>
  <text class="t ts" x="395" y="183">fetch</text>

  <line class="a" x1="440" y1="180" x2="380" y2="160"/>
  <text class="t ts" x="395" y="155">json</text>

  <line class="a" x1="380" y1="170" x2="440" y2="140"/>
  <text class="t ts" x="412" y="170">write</text>

  <line class="a" x1="180" y1="40" x2="200" y2="40"/>
  <line class="a" x1="290" y1="60" x2="290" y2="100"/>
  <text class="t ts" x="305" y="80" text-anchor="start">deploy</text>
</svg>
