<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="fb-title fb-desc">
  <title id="fb-title">Per-field stale fallback</title>
  <desc id="fb-desc">When primary and fallback temperature stations both fail, the assembler reuses the last good KV value and marks the temperature field stale. Tide is independent.</desc>
  <style>
    .b { fill: none; stroke: #f5c518; stroke-width: 1.5; }
    .bx { fill: none; stroke: #f5c518; stroke-width: 1.5; stroke-dasharray: 5 3; opacity: 0.55; }
    .t { fill: #f5c518; font-family: ui-monospace, "Share Tech Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.05em; }
    .tl { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .ts { font-size: 9.5px; opacity: 0.78; }
    .a { fill: none; stroke: #f5c518; stroke-width: 1.5; marker-end: url(#arr); }
    .ax { fill: none; stroke: #f5c518; stroke-width: 1.2; stroke-dasharray: 4 3; opacity: 0.55; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5c518"/>
    </marker>
  </defs>

  <!-- Tick label -->
  <text class="t tl" x="20" y="22">CRON TICK</text>

  <!-- Primary station -->
  <rect class="b" x="20" y="50" width="160" height="44"/>
  <text class="t tl" x="100" y="72" text-anchor="middle">PRIMARY</text>
  <text class="t ts" x="100" y="86" text-anchor="middle">noaa 9414290 · offline</text>

  <!-- Fallback station -->
  <rect class="b" x="20" y="118" width="160" height="44"/>
  <text class="t tl" x="100" y="140" text-anchor="middle">FALLBACK</text>
  <text class="t ts" x="100" y="154" text-anchor="middle">noaa 9414750 · offline</text>

  <!-- Tide -->
  <rect class="b" x="20" y="186" width="160" height="44"/>
  <text class="t tl" x="100" y="208" text-anchor="middle">TIDE</text>
  <text class="t ts" x="100" y="222" text-anchor="middle">noaa 9414290 · ok</text>

  <!-- coalesce -->
  <rect class="b" x="240" y="100" width="160" height="80"/>
  <text class="t tl" x="320" y="124" text-anchor="middle">COALESCE</text>
  <text class="t ts" x="320" y="142" text-anchor="middle">temp: previous KV</text>
  <text class="t ts" x="320" y="156" text-anchor="middle">tide: fresh fetch</text>
  <text class="t ts" x="320" y="172" text-anchor="middle">freshness ≤ 24h</text>

  <line class="ax" x1="180" y1="72" x2="240" y2="125"/>
  <line class="ax" x1="180" y1="140" x2="240" y2="140"/>
  <line class="a" x1="180" y1="208" x2="240" y2="155"/>

  <!-- Output record -->
  <rect class="b" x="460" y="60" width="160" height="160"/>
  <text class="t tl" x="540" y="82" text-anchor="middle">SPOT RECORD</text>
  <line class="b" x1="460" y1="92" x2="620" y2="92"/>
  <text class="t ts" x="475" y="112">water_temp_f</text>
  <text class="t ts" x="605" y="112" text-anchor="end">63.2</text>
  <text class="t ts" x="475" y="128">temp_observed_at</text>
  <text class="t ts" x="605" y="128" text-anchor="end">07:00</text>
  <text class="t ts" x="475" y="144" font-weight="700">temp_stale</text>
  <text class="t ts" x="605" y="144" text-anchor="end" font-weight="700">true</text>
  <line class="b" x1="475" y1="156" x2="605" y2="156" opacity="0.5"/>
  <text class="t ts" x="475" y="172">tide.next</text>
  <text class="t ts" x="605" y="172" text-anchor="end">14:42 H</text>
  <text class="t ts" x="475" y="188" font-weight="700">tide_stale</text>
  <text class="t ts" x="605" y="188" text-anchor="end" font-weight="700">false</text>

  <line class="a" x1="400" y1="140" x2="460" y2="140"/>
  <text class="t ts" x="430" y="134" text-anchor="middle">write KV</text>
</svg>
