<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{% block meta_description %}{{ config.description }}{% endblock %}">
  <meta name="theme-color" content="#f1e6cf">
  <title>{% block title %}Swim Francisco{% endblock %}</title>
  <link rel="canonical" href="{% block canonical_url %}{{ current_url | default(value=config.base_url ~ '/') | safe }}{% endblock %}">
  <meta property="og:site_name" content="Swim Francisco">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:title" content="{% block social_title %}Swim Francisco{% endblock %}">
  <meta property="og:description" content="{% block social_description %}{{ config.description }}{% endblock %}">
  <meta property="og:url" content="{% block social_url %}{{ current_url | default(value=config.base_url ~ '/') | safe }}{% endblock %}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="{{ get_url(path='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ get_url(path='main.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p class="site-footer-credit">Made in San Francisco by <a href="https://x.com/cbzehner" rel="me noopener" target="_blank">@cbzehner</a></p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
