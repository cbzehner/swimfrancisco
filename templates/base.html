<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ config.description }}">
  <meta name="theme-color" content="#1a1a2e">
  <title>{% block title %}Swim Francisco{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ get_url(path='favicon.svg') }}">
  <link rel="stylesheet" href="{{ get_url(path='main.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p class="site-footer-sources">Pool hours · SF Rec &amp; Park · Open-water · NOAA + NDBC</p>
    <p class="site-footer-credit">Made in San Francisco by <a href="https://x.com/cbzehner" rel="me noopener" target="_blank">@cbzehner</a></p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
