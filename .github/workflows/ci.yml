name: ci

# Runs the same `just check` gate as the devenv pre-push hook, so a
# push with --no-verify can no longer reach Cloudflare's auto-deploy
# untested. Keep this green: main deploys on push.
#
# Public-repo safety: read-only permissions, no secrets used.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"

      - name: Install zola
        # Pinned to the version devenv provides locally.
        run: |
          curl -sL https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.local/bin"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync schedule-tools deps
        run: uv --project schedule-tools sync

      - name: Install Playwright browsers
        run: node node_modules/playwright-core/cli.js install --with-deps webkit chromium

      - name: Run full verification
        run: just check
