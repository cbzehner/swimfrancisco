name: ci

# Runs full verification. Production Workers Builds waits for this
# workflow's successful push run for its exact commit before building,
# and schedule promotion waits for one on its auto/schedules branch.
#
# Public-repo safety: read-only permissions, no secrets used.

on:
  push:
    branches: [main, 'auto/schedules/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Upgrade deliberately: WebKit binaries depend on the Ubuntu release.
    runs-on: ubuntu-24.04
    # Recent successful runs took 5–12 minutes; leave cold-cache headroom.
    timeout-minutes: 15
    # Matches the timezone the justfile pins locally, so a clock-reading
    # test cannot pass in one place and fail in the other.
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: schedule-tools/uv.lock

      - name: Cache just + zola
        id: bin-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: bins-just-zola-0.22.1-${{ runner.os }}

      - name: Put cached bins on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install just
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"

      - name: Install zola
        if: steps.bin-cache.outputs.cache-hit != 'true'
        # Pinned to the version devenv provides locally.
        run: |
          curl -sL https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.local/bin"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync schedule-tools deps
        run: uv --project schedule-tools sync --locked

      - name: Resolve browser cache identity
        id: browsers
        run: |
          . /etc/os-release
          echo "os=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
          node --input-type=commonjs <<'NODE' >> "$GITHUB_OUTPUT"
          const { createRequire } = require("node:module");
          const engineRequire = createRequire(require.resolve("@e2e-dev/web"));
          console.log(`regressions=${require("playwright-core/package.json").version}`);
          console.log(`journeys=${engineRequire("playwright-core/package.json").version}`);
          NODE

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Never restore the old OS-agnostic cache: WebKit revision paths do
          # not distinguish Ubuntu ABIs. Both suites share this directory.
          key: browsers-v2-${{ steps.browsers.outputs.os }}-${{ runner.arch }}-${{ steps.browsers.outputs.regressions }}-${{ steps.browsers.outputs.journeys }}
          restore-keys: browsers-v2-${{ steps.browsers.outputs.os }}-${{ runner.arch }}-

      - name: Install browser OS dependencies
        # System packages are not cached. The locked Playwright versions use
        # the same Ubuntu 24.04 package list; invoke apt only once.
        run: node node_modules/playwright-core/cli.js install-deps webkit chromium

      - name: Install regression browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: node node_modules/playwright-core/cli.js install webkit chromium

      - name: Install e2e engine browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/e2e-web install webkit chromium

      - name: Check browser launches
        timeout-minutes: 1
        # Fail before the long Python suite if a restored browser cannot run.
        run: |
          node --input-type=commonjs <<'NODE'
          const { createRequire } = require("node:module");
          const engineRequire = createRequire(require.resolve("@e2e-dev/web"));
          (async () => {
            for (const playwright of [require("playwright-core"), engineRequire("playwright-core")]) {
              for (const engine of ["webkit", "chromium"]) {
                const browser = await playwright[engine].launch({ timeout: 10_000 });
                console.log(`${engine}: ${browser.version()}`);
                await browser.close();
              }
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Run full verification
        run: just check

      - name: Upload e2e failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-and-traces
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: ignore
