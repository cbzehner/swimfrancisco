name: schedules-promote

# Daily: promote any queued [extra.upcoming_schedule] block into the
# canonical [extra] schedule once today >= upcoming.effective_start.
# Cloudflare auto-deploys on push to main, so a merged promotion PR
# lands in the daily site rebuild without extra wiring.
#
# Render-time logic already handles the current → upcoming switch for
# users (templates/spots/page.html + static/js/helpers/board.mjs both
# call pick_active_schedule), so this is purely data hygiene. On days
# with nothing to promote (most days) the job is a no-op.
#
# Opens a PR rather than pushing straight to main so promotion stays
# reviewable. The PR title carries the date; merging is the one click
# that takes the data live. If you want set-and-forget, enable
# auto-merge on the repo and the workflow's GITHUB_TOKEN.

on:
  schedule:
    # 14:00 UTC = 07:00 PT (PDT) / 06:00 PT (PST). Runs well after PT
    # midnight so today-in-PT is unambiguous, and well before the next
    # daily site rebuild (00:00 PT next day) so merged promotions ship.
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: schedules-promote
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync schedule-tools deps
        run: uv --project schedule-tools sync

      - name: Promote eligible upcoming schedules
        run: uv --project schedule-tools run schedules promote

      - name: Open or update PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet content/spots/; then
            echo "No promotions today."
            exit 0
          fi
          DATE=$(date +%Y-%m-%d)
          BRANCH="auto/schedules-promote-${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${BRANCH}"
          git add content/spots/
          git commit -m "chore(schedules): auto-promote upcoming → current ${DATE}"
          git push --force origin "${BRANCH}"

          if EXISTING=$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number') && [ -n "${EXISTING}" ]; then
            echo "PR #${EXISTING} already open for ${BRANCH}."
          else
            gh pr create \
              --head "${BRANCH}" \
              --base main \
              --title "chore(schedules): auto-promote ${DATE}" \
              --body "Daily \`schedules-promote\` job promoted one or more queued \`upcoming_schedule\` blocks into the canonical schedule on the spot frontmatter. Render-time logic already handles the gap-day switch for users; this PR is pure data hygiene."
          fi
