name: schedules-extract

on:
  schedule:
    - cron: '0 16 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: "Extract only, or publish independently verified changes"
        type: choice
        options: [extract-only, publish]
        default: extract-only

permissions: {}

concurrency:
  group: schedules-extract
  cancel-in-progress: false

jobs:
  extract:
    if: github.ref == 'refs/heads/main' && vars.SCHEDULES_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write
      actions: read
    env:
      SCHEDULES_AUTOMATION_ENABLED: ${{ vars.SCHEDULES_AUTOMATION_ENABLED }}
      SCHEDULES_MONTHLY_BUDGET_USD: ${{ vars.SCHEDULES_MONTHLY_BUDGET_USD }}
      SCHEDULES_MONTHLY_BUDGET_OVERRIDES: ${{ vars.SCHEDULES_MONTHLY_BUDGET_OVERRIDES }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLOUDFLARE_BROWSER_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Require capture credentials and CI-capable token
        env:
          SCHEDULES_BOT_TOKEN: ${{ secrets.SCHEDULES_BOT_TOKEN }}
        run: |
          test -n "$SCHEDULES_BOT_TOKEN"
          test -n "$CLOUDFLARE_BROWSER_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SCHEDULES_BOT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: schedule-tools/uv.lock

      - run: npm ci
      - run: uv --project schedule-tools sync --locked
      - name: Install live browser checks
        run: node node_modules/playwright-core/cli.js install --with-deps webkit chromium

      - name: Check paid allowance before any model call
        id: reserve
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          uv --project schedule-tools run --locked schedules budget reserve --run-id "$RUN_ID" --output tmp/api-budget
          node --input-type=module -e '
            import { readFileSync, appendFileSync, writeFileSync } from "node:fs";
            import { resolve } from "node:path";
            const receipt = JSON.parse(readFileSync("tmp/api-budget/reservation.json", "utf8"));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Paid extraction allowance: " + receipt.status + "\n");
            writeFileSync("tmp/browser-budget.json", JSON.stringify({limit_seconds: 300, used_seconds: 0, blocked: false}), {flag: "wx"});
            appendFileSync(process.env.GITHUB_ENV,
              "SCHEDULES_API_BUDGET_FILE=" + resolve("tmp/api-budget/budget.json") + "\n" +
              "SCHEDULES_BROWSER_BUDGET_FILE=" + resolve("tmp/browser-budget.json") + "\n" +
              "SCHEDULES_API_BUDGET_USD=" + receipt.limit_microusd / 1000000 + "\n");
          '

      - name: Extract and check publication
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
        run: uv --project schedule-tools run --locked schedules automate --mode "$RUN_MODE" --run-id "$RUN_ID"

      - name: Settle charges, keeping reservations for missing usage
        if: always() && steps.reserve.outcome == 'success'
        run: uv --project schedule-tools run --locked schedules budget settle --directory tmp/api-budget

      - name: Preserve source evidence and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-automation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/automation/
            tmp/api-budget/reservation.json
            tmp/api-budget/budget.json
            tmp/api-budget/api-attempts/
            tmp/browser-budget.json
          retention-days: 90
          if-no-files-found: warn

  review-closures:
    needs: extract
    if: always() && needs.extract.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.SCHEDULES_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.SCHEDULES_BOT_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: schedule-automation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Open deduplicated draft closure reviews
        run: uv --project schedule-tools run --locked schedules closure-prs --evidence evidence/automation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closure-review-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/automation/closure-prs.json
          retention-days: 90
          if-no-files-found: warn

  report:
    needs: [extract, review-closures]
    if: always() && needs.extract.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: schedule-automation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - name: Update one deduplicated operator issue
        uses: actions/github-script@v7
        env:
          EXTRACT_RESULT: ${{ needs.extract.result }}
          CLOSURE_REVIEW_RESULT: ${{ needs.review-closures.result }}
        with:
          script: |
            const fs = require('node:fs');
            let result = {};
            try { result = JSON.parse(fs.readFileSync('evidence/automation/result.json', 'utf8')); } catch {}
            const builds = result.builds || [];
            const last = builds.at(-1) || {};
            const flags = last.decisions?.flagged_set || [];
            const commandFailures = Object.entries(last.commands || {}).filter(([, exit]) => exit !== 0).map(([name]) => name);
            const failed = process.env.EXTRACT_RESULT !== 'success' || process.env.CLOSURE_REVIEW_RESULT === 'failure' || result.status === 'failed' || !result.status;
            const paidUnavailable = result.paid_budget_status === 'unavailable';
            const needsAttention = failed || flags.length || commandFailures.length || paidUnavailable;
            const marker = '<!-- schedule-automation-status -->';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100 });
            const issue = issues.find(item => !item.pull_request && item.body?.includes(marker));
            if (!needsAttention) {
              if (issue) await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              return;
            }
            const fingerprint = JSON.stringify({ failed, paidUnavailable, flags: [...flags].sort(), commandFailures: commandFailures.sort() });
            const statusMarker = '<!-- state:' + Buffer.from(fingerprint).toString('base64') + ' -->';
            if (issue?.body?.includes(statusMarker)) return;
            const runUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const body = [marker, statusMarker, 'Schedule automation needs attention.',
              '', 'Publication status: ' + (result.status || process.env.EXTRACT_RESULT),
              'Held pools: ' + (flags.join(', ') || 'see run evidence'),
              'Paid extraction allowance: ' + (result.paid_budget_status || 'unknown'),
              'Extraction commands with held or failed sources: ' + (commandFailures.join(', ') || 'none'),
              'Confirmed live updates: ' + (result.status === 'published' ? result.published_slugs.join(', ') || 'none' : 'none'),
              '', '[Run and retained evidence](' + runUrl + ')'].join('\n');
            if (issue) await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            else await github.rest.issues.create({ owner, repo, title: 'Schedule automation needs attention', body });
