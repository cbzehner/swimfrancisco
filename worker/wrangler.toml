name = "swimfrancisco"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# `worker/src/spots.ts` is generated from content/spots/*.md frontmatter
# by `scripts/generate-worker-spots.mjs`. Regeneration runs locally via
# the `pretypecheck` npm script and `just check` enforces it via the
# `test_worker_spots.py` parity test, so the committed file is always
# up-to-date by the time CWB picks it up. We do NOT use a wrangler [build]
# hook here — wrangler 4.x runs custom builds from the deploy invocation's
# CWD (repo root in CWB) rather than the wrangler.toml directory, which
# breaks relative paths in CWB's /opt/buildhome/repo sandbox.

# Three crons:
#  - `0 * * * *` — hourly NOAA/NDBC refresh (unchanged).
#  - `5 7 * * *` and `5 8 * * *` — daily rebuild candidates. Cron expressions
#    run in UTC; one maps to 00:05 PT each half of the year (PDT = `5 7 UTC`,
#    PST = `5 8 UTC`). The `scheduled` handler gates on PT hour 0 + minute 5
#    so exactly one rebuild fires per calendar day.
[triggers]
crons = ["0 * * * *", "5 7 * * *", "5 8 * * *"]

# Unified Workers Builds model. Wrangler serves the built Zola output from
# ../public as static assets and invokes this Worker for /api/* and
# /__scheduled. Same origin locally and in production.
[assets]
directory = "../public"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/__scheduled"]

# KV namespace for per-spot conditions. IDs are managed by Terraform
# (terraform/worker.tf → cloudflare_workers_kv_namespace.conditions /
# conditions_preview) and exposed via `terraform output`.
[[kv_namespaces]]
binding = "CONDITIONS"
id = "3b9bd339595448b3b1e057d44bea7f49"
preview_id = "71167f5251b447c3aea11e6d3805cf8b"

# CORS: HTTP handlers (Step 15) must allow origin https://swimfrancisco.com
# (plus https://*.swimfrancisco.pages.dev preview deployments if needed).

# Routes — uncomment ONE of the two options below once the swimfrancisco.com
# zone exists in this Cloudflare account. See docs/deploy.md for full setup.
#
# Option A (recommended, single-origin): bind the Worker under the apex so
# the static site and API share an origin. No CORS needed for production.
# [[routes]]
# pattern = "swimfrancisco.com/api/*"
# zone_name = "swimfrancisco.com"
#
# Option B (dedicated subdomain): expose the Worker at api.swimfrancisco.com.
# Requires a DNS record and CORS allow-list already covers this host.
# [[routes]]
# pattern = "api.swimfrancisco.com/*"
# zone_name = "swimfrancisco.com"
