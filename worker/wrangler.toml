name = "swimfrancisco"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Workers Logs persisted to the dashboard. `invocation_logs` adds the
# auto-generated request/response/metadata line per invocation alongside
# any console.* calls already in the handler.
[observability.logs]
enabled = true
invocation_logs = true

# One hourly cron. Every tick refreshes conditions data; the tick that
# happens to land at 00:00 PT also fires a rebuild (handler-side check
# via `isPtMidnight`), keeping the server-rendered day-of-week current.
# DST is handled inside the Worker via Intl, not by the cron config.
[triggers]
crons = ["0 * * * *"]

# Unified Workers Builds model. Wrangler serves the built Zola output from
# ../public as static assets and invokes this Worker for /api/* and
# /__scheduled. Same origin locally and in production.
[assets]
directory = "../public"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/__scheduled", "/ingest/*"]

# KV namespace for per-spot conditions. IDs are managed by Terraform
# (terraform/worker.tf → cloudflare_workers_kv_namespace.conditions /
# conditions_preview) and exposed via `terraform output`.
[[kv_namespaces]]
binding = "CONDITIONS"
id = "3b9bd339595448b3b1e057d44bea7f49"
preview_id = "71167f5251b447c3aea11e6d3805cf8b"
