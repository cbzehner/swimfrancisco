      <h1 class="page-title">Bakar Fitness Center at UCSF Mission Bay</h1>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>The minute you walk through the doors at Mission Bay, you’ll be met by a dynamic, spacious environment and colorful, contemporary art and architecture. Opened in 2005, UCSF Mission Bay is part of a vibrant and growing neighborhood in the heart of a thriving biotech center. This unique and beautiful fitness center boasts three fitness floors, an incredible view of downtown San Francisco and serves the UCSF community and surrounding neighbors.</p><h2 class="text-h4">Amenities</h2><ul><li>State-of-the-art equipment</li><li>Outdoor rooftop pool</li><li>Indoor swimming pool</li><li>Dedicated Pilates studio</li><li>Rooftop exercise terrace</li><li>Squash and racquetball courts</li><li>Locker rooms and saunas</li><li>NBA full-sized basketball court</li><li>Group X and F45 classes</li><li>Functional training space</li><li>Online class reservations</li><li>Towel Service<br>&nbsp;</li></ul><h2 class="text-h4">Programs Offered</h2><ul><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/recreational-sports">Drop-In &amp; Rec Sports</a></li><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/personal-training">Personal and Small Group Training</a>*</li><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/pilates">Pilates Classes and Training</a>*</li><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/group-fitness">Group Fitness Classes</a></li><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/membership#f45">F45 Training</a>*</li><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/outdoor-programs">Outdoor</a> (Backpacking, Camping)</li><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/youth-aquatics">Swim Lessons*</a></li><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/adult-aquatics">Masters Swim Team*</a></li></ul><p><em>*Available for an additional fee</em></p><h2 class="text-h4">Class Schedule</h2><p><a href="/fitnessrecreation/schedules">View our Class Schedules page &gt;&gt;</a></p><h2 class="text-h4">Hours &amp; Location</h2><p>Facility Hours: Monday-Friday, 6:00 am-9:00 pm; Saturday-Sunday, 8:00 am-6:00 pm</p><p>William J. Rutter Center<br><a href="https://www.google.com/maps/place/Bakar+Fitness+%26+Recreation+Center+at+UCSF+Mission+Bay/@37.7679895,-122.3937464,3a,75y,90t/data=!3m8!1e2!3m6!1sAF1QipPrMLRiUBzXwy0wwCd6xP67frTDiJVZ3x6_dZbk!2e10!3e12!6shttps:%2F%2Flh3.googleusercontent.com%2Fp%2FAF1QipPrMLRiUBzXwy0wwCd6xP67frTDiJVZ3x6_dZbk%3Dw133-h86-k-no!7i6016!8i3880!4m7!3m6!1s0x808f7fcef9a8173f:0x1d557fc43e915386!8m2!3d37.7681212!4d-122.3930817!10e5!16s%2Fg%2F12h_h4cs6?entry=ttu&amp;g_ep=EgoyMDI1MDcxNS4xIKXMDSoASAFQAw%3D%3D">1675 Owens Street, San Francisco, CA 94158</a></p><p><a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/news/2026-fitness-and-recreation-holiday-schedule">2026 Holiday Hours</a></p><h2 class="text-h4">Parking &amp; Transportation</h2><p><a href="https://campuslifeserviceshome.ucsf.edu/transportation/parking-fit-rec-member">Discounted parking</a> is offered to Bakar Fitness &amp; Recreation members through UCSF Transportation Services.&nbsp;</p><p>For help planning your route to Bakar Fitness &amp; Recreation Center, visit&nbsp;<a href="http://mycommute.ucsf.edu/">mycommute.ucsf.edu</a>. Select the “Transit” option for shuttles and buses.</p><h2 class="text-h4">Membership</h2><p><a href="/fitnessrecreation/membership">Become a Member&nbsp;Today &gt;&gt;&nbsp;</a></p><h2 class="text-h4">Contact Us</h2><p><strong>Membership Inquiries:</strong> <a href="mailto:Member.services@ucsf.edu">Member.services@ucsf.edu</a> | 415.476.5646<br><br>If you're interested in cancelling a class or booking a court reservation, please contact our <strong>Service Desk:</strong> <a href="mailto:ucsf.fitness@ucsf.edu">ucsf.fitness@ucsf.edu</a> | 415.514.4545</p></div>
