            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>F45 Training combines elements of High-Intensity Interval Training (HIIT), Circuit Training, and Functional Training. The fusion of these three training concepts has led to the development of 45 different, 45-minute workout experiences featuring 3,000 exercises, so you can tackle a new challenge every day. <em><strong>Classes are available at Bakar Fitness Center at Mission Bay only.</strong></em></p><p>&nbsp;</p><p class="responsive-iframe"><iframe height="314" src="https://www.facebook.com/plugins/video.php?height=314&amp;href=https%3A%2F%2Fwww.facebook.com%2FUCSF.Fitness.Recreation%2Fvideos%2F1034664133382338%2F&amp;show_text=false&amp;width=560&amp;t=0" title="F45 Training" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">&nbsp;</iframe></p><h2 class="text-h4"><strong>F45 3-Class Trial</strong></h2><p>Want to experience F45 but not ready to commit? Join us for a <strong>free</strong> 3-Class Trial! Contact <a href="mailto:member.services@ucsf.edu">member.services@ucsf.edu</a> to start your trial. <em>Classes must be redeemed within 30 days, local residents only.</em></p><h2 class="text-h4"><strong>F45 Benefits</strong></h2><ul><li>Specialized F45 training coaches</li><li>Dedicated F45 studio and equipment</li><li>45 unique workout experiences&nbsp;<a href="http://f45training.com/workouts/">(descriptions)</a></li><li>Exercises that change daily</li><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/mobile-app">Mobile app</a>&nbsp;class reservation</li><li>Plus all the benefits of a Premier Membership&nbsp;</li></ul><h2 class="text-h4"><strong>F45&nbsp; Schedule</strong></h2><p><a href="https://calendar.google.com/calendar/embed?src=534cd393d2397a61936018a51a15dc3a3ee81fc209791a3e944831108765711e%40group.calendar.google.com&amp;ctz=America%2FLos_Angeles">View our monthly schedule</a></p><ul><li>Monday, Wednesdays, Fridays: Cardio</li><li>Tuesdays, Thursdays, Sundays: Strength</li><li>Saturdays: Hybrid (Cardio and Strength)&nbsp;</li></ul><h2 class="text-h4"><strong>F45&nbsp; Membership Options</strong></h2><p>F45 Training is available as an add-on to your UCSF Fitness and Recreation membership.&nbsp; Classes can also be purchased as a 10-Class Pack or a Single Visit. Please visit our <a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/membership">Membership page</a> or contact <a href="mailto:member.services@ucsf.edu">member.services@ucsf.edu</a> for more information.</p><p>1. Membership Add-On Bundle: $75/month for members, $47/month for UCSF Students</p><p>2. 10-Class Pack: $250/members, $320/non-members</p><p>3. F45 Single Visit: $30/members, $40/non-members</p></div>

</div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><h2 class="text-h4">About Group Fitness Classes</h2><p>With over 60 Group X classes ranging from beginner to advanced levels, you’re bound to find a class or two that’s perfect for you – classes range from BODYPUMP™ to ZUMBA® to yoga. Group X classes are included with Premier and F45 Memberships.</p><p>Our certified instructors will assist you in enhancing your current skill level in a specific discipline or provide you with recommendations to try something new.</p><h2 class="text-h4">Class Reservations</h2><p>Class reservations are recommended to secure your spot in class. Reservations open 72 hours prior to class. If you make a reservation and are not able to attend, please cancel out of our reservation so other members can have the opportunity to participate.&nbsp;</p><p>Reserve a class <a href="https://ucsfrecreationcenters.trainerize.com/app/login">online</a> or on our <a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/mobile-app">mobile app</a>. Non-members can participate by purchasing a <a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/day-pass">Day Pass</a>.</p><p>If you do not reserve a class, you can be added to our standby list 15 minutes prior to class. At the class start time, names will be called off the standby list.<br><br><strong>How-To:</strong> Watch a video tutorial on how to book and cancel a class in our new app <a href="https://ucsf.box.com/s/refo212xuekp0hucgl1yxecyn84kum88">online here</a>.</p><h2 class="text-h4">Checking In</h2><p>Please check in at the Service Desk prior to class. Check in is available 30 minutes prior to class until the class start time. Please note members must enter the class within 5 minutes of the class start time.<br><br>Once in class, please have your class booking confirmation handy. An instructor may ask to see your confirmation if the class is full.&nbsp;</p><h2 class="text-h4">Contact</h2><p>Gerri Nuval, Assistant Fitness Manager<br><a href="mailto: Gerri.nuval@ucsf.edu">Gerri.nuval@ucsf.edu</a></p></div>

</a>

  <div class="node__content clearfix">
    
  <div class="field field--name-field-header field--type-entity-reference field--label-above">
    <div class="field__label">Header</div>
              <div class="field__item"><a href="/node/466" hreflang="en">FitRec Personal Training Hero</a></div>
          </div>

  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item">  <img loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/2026-02/FR-Personal-Training.jpg" width="5200" height="3467" alt="Female personal trainer with a female client standing at the power rack" />

</div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>Work with our nationally certified Personal Trainers to reach your fitness goals and achieve results quickly, safely, and effectively. Our trainers specialize in many areas, including:</p><p>• Weight loss<br>• Core strengthening and postural alignment<br>• Sport-specific training<br>• Balance and flexibility<br>• Injury prevention<br>• Post-rehab, pre- and postnatal</p><h2 class="text-h4">Personal Training Packages</h2><p><strong>*Special Offer* 3-Session Starter Pack (Members only)</strong><br><em>Available only to first-time private personal training customers.</em></p><p>Add some spark to your workout with a personal trainer at our special introductory rate. This starter pack is perfect for beginners who want to learn how to exercise safely and for experienced exercisers who want to refresh their workout program.&nbsp;</p><p>$250/3 Sessions</p><p>&nbsp;</p><p><strong>Pro Trainer Packages</strong><br>Pro trainers have up to six years of experience.</p><p>$102/127 (member/non-member) 1 Session*/**<br>$480/635 (member/non-member) 5 Sessions (includes unlimited InBody Body Composition Assessment)*/**<br>$920/1270 (member/non-member) 10 Sessions (includes unlimited InBody Body Composition Assessment)*/**</p><p>&nbsp;</p><p><strong>Elite Trainer Packages</strong><br>Elite trainers have six or more years of experience.</p><p>$112/137 (member/non-member) 1 Session*/**<br>$530/685 (member/non-member) 5 Sessions (includes unlimited InBody Body Composition Assessment)*/**<br>$1020/1370 (member/non-member) 10 Sessions (includes unlimited InBody Body Composition Assessment)*/**</p><p><br>*UCSF Staff, Faculty, and Learners who are Fitness and Recreation members get 10% off the above pricing.<br>**Partner Training package prices available upon request.</p><h2 class="text-h4">Body Composition Assessment&nbsp;</h2><p><strong>Inbody Body Composition (Parnassus) and Evolt 360 (Mission Bay)</strong></p><p>Measure your body fat and muscle mass in minutes! This assessment is quick, easy, and highly accurate. Find out what you're made of, set goals to target the areas of your body that need work, and start tracking your progress month after month. Includes consultation with a personal trainer to better understand your results. <a href="https://ucsf.box.com/s/k4jqwhq7jgvsb8mpkldcimkxwxl93hza">Follow these guidelines to ensure accurate test results.</a>&nbsp;</p><p>Single test: $25/member, $35/non-member<br>3-pack: $60/member, $90/non-member<br>5-pack: $90/member, $125/non-member</p><p>To schedule your InBody assessment, contact our&nbsp;Assistant Director of Fitness Programs, Adrienne Chambers, at&nbsp;<a href="mailto:Adrienne.chambers@ucsf.edu">Adrienne.chambers@ucsf.edu</a></p><p><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/mobile-app">Learn how to purchase on our mobile app page</a>.&nbsp;</p><p>&nbsp;</p><p><strong>Sign Up&nbsp;</strong></p><p>To make an appointment for private training, contact the Personal Training Fitness team at 415.514.4538 or contact our Assistant Director of Fitness Programs, Adrienne Chambers, at&nbsp;<a href="mailto:adrienne.chambers@ucsf.edu">adrienne.chambers@ucsf.edu</a>. Sessions can also be purchased on the Fitness and Recreation Mobile App - <a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/mobile-app">visit our web page for more information.</a></p><h2 class="text-h4">Complimentary Personal Training Session - (Members only)</h2><p>Did you know new members receive a complimentary session with a certified personal trainer? This free session is the perfect opportunity to be introduced to the fitness center, learn how to use the equipment, and jumpstart your fitness goals. Our trainers are well-versed in all areas of health and fitness and will work with you on a program that fits your needs - whether it be general fitness goals, post-rehab, pre-/post-natal, weight management, injury prevention, strength training, functional training, or more.&nbsp;&nbsp;</p><p><em>What to expect</em> - At the beginning of the session, your trainer will discuss your health history, fitness goals, and previous workout experience to design a plan for you. During the session, you will learn proper exercise techniques and experience the benefits of an individualized program.</p><p><a href="https://app.e2ma.net/app2/audience/signup/1971803/1812396/">Sign up today</a></p><h2 class="text-h4">Policies &amp; FAQ</h2><p><a href="/fitnessrecreation/personal-training-policies">View online &gt;&gt;&nbsp;</a></p><h2 class="text-h4">Contact</h2><p>Adrienne Chambers, Assistant Director, Fitness Programs<br><a href="mailto:Adrienne.chambers@ucsf.edu">Adrienne.chambers@ucsf.edu</a></p></div>

            <h2 class="node__title">
        <a href="/fitness-and-recreation/pilates" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">Pilates</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-header field--type-entity-reference field--label-above">
    <div class="field__label">Header</div>
              <div class="field__item"><a href="/node/486" hreflang="en">FitRec Pilates Hero</a></div>
          </div>

  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item">  <img loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/2025-11/FR-Pilates_0.jpg" width="3668" height="5000" alt="Pilates with women and men standing on equipment alongside instructor demonstration" />

</div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>Gain total body strength, balance, and core control. Both new and experienced Pilates practitioners have plenty to love about Pilates at UCSF. You’ll find a range of traditional and specialty instruction to meet your fitness goals and skill level. Whether your focus is improved posture, injury prevention, post-rehab, pre-/post-natal, or sports-specific training, our trainers can help you achieve your goals.</p><p>A dedicated team of certified instructors helps ensure you have a positive experience and get the most from your workouts. Our goal is to inspire individuals and groups to feel invigorated and motivated. We do that by creating Pilates instruction that is fun, challenging, and, of course, rewarding.</p><p><em>Pilates is available only at the Bakar Fitness &amp; Recreation Center at UCSF Mission Bay.</em></p><h2 class="text-h3">Specialty Programs</h2><p><strong>Walk it Out: Feet, Balance, and Gait Mastery</strong>&nbsp;<br>Strengthen your foundation - this Pilates-based class uses specialized equipment to improve foot and ankle function, enhance gait patterns, and support healthy lower body movement. Limited to 6 participants.</p><p>• June 1-29 (5 sessions): Mondays, 12:00-1:00 pm, $175/member, $225/non-member</p><p><a href="https://secure.touchnet.net/C20191_ustores/web/store_cat.jsp?STOREID=23&amp;CATID=97">Register here</a></p><h2 class="text-h3">Pilates Classes</h2><p><strong>Pilates Dynamic Mix</strong></p><p>Experience an invigorating workout combining popular Pilates equipment like the Reformer, EXO Chair, and Tower. Your instructor will guide you through fun and challenging exercises for a total body workout that strengthens, lengthens, and tones.</p><p><em>Note: These classes are not appropriate for those with injuries or rehabbing from an injury. See Adrienne Chambers for more information.</em></p><p><a href="https://calendar.google.com/calendar/embed?src=46b19a1880363a2b7459e82cff8ced19702d46a594e36135d610d45c94a6761a%40group.calendar.google.com&amp;ctz=America%2FLos_Angeles">View our monthly calendar</a><br><br><strong>Member Pricing</strong><br>Single Class drop-in: $35 (members)<br>5 Class Pass: $160 (members)*<br>10 Class Pass: $290 (members)*<br><br>*UCSF Members get 10% off the member price</p><p><strong>New Client Offer</strong><br>Intro 3 Class Pack<br>$75 (one-time purchase for new Pilates clients only, and must be purchased at the front desk)<br><br>For non-member pricing, please contact <a href="mailto:adrienne.chambers@ucsf.edu">adrienne.chambers@ucsf.edu</a>.<br>&nbsp;</p><h2 class="text-h3"><strong>Pilates Reformer Class Pass Sign Up</strong></h2><p>Download the UCSF Fitness and Recreation <a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/mobile-app">mobile app</a> or <a href="https://ucsfrecreationcenters.trainerize.com/app/login">sign up online</a>.</p><ul><li>Enjoy the freedom to attend classes that fit your schedule.</li><li>Guarantee your spot up to 3 days in advance.</li><li>Reservations close 30 minutes prior to class.</li><li>Cancel at least 2 hours prior to class start time to avoid being charged for the class.</li><li>Classes are subject to change without notice.</li><li>Pass expires 90 days from date of purchase.</li></ul><p>&nbsp;</p><h2 class="text-h3">Complimentary Pilates Session - (Members only)</h2><p>New members receive a complimentary Pilates session at Bakar Fitness Center with a certified instructor. This session is the perfect opportunity to be introduced to the program and equipment!</p><p>What to expect: At the beginning of the session, our Pilates instructor will gather information about your health history, physical limitations, fitness goals, and workout experience. You will be introduced to the Pilates Method of training and essential Pilates Reformer exercises for your abs, back, legs, and arms. There will be time at the end of the session to answer any questions you may have about Pilates or our program.</p><p><a href="https://app.e2ma.net/app2/audience/signup/1971803/1812396/">Sign up today</a></p><h2 class="text-h3">Private Training Packages - (Members only)</h2><p><strong>*Special Offer* 3-Session Starter Pack</strong><br>This is an excellent introduction for first timers and an ideal way to get one-on-one attention from a certified Pilates instructor. Learn key foundational moves to help you progress in your practice, use it as a preview to more in-depth private training, or to get acclimated before joining small group training classes.&nbsp;<em>Available only to first-time Pilates private session customers.</em></p><p>$250/3 Sessions</p><p><br><strong>Pro Trainer Packages</strong><br>Pro trainers have up to six years of experience.</p><ul><li>$102/127 (member/non-member) 1 Session*/**</li><li>$480/635 (member/non-member) 5 Sessions (includes unlimited InBody Body Composition Assessment)*/**</li><li>$920/1270 (member/non-member) 10 Sessions (includes unlimited InBody Body Composition Assessment)*/**</li></ul><p><br><strong>Elite Trainer Packages</strong><br>Elite trainers have six or more years of experience.</p><ul><li>$112/137 (member/non-member) 1 Session*/**</li><li>$530/685 (member/non-member) 5 Sessions (includes unlimited InBody Body Composition Assessment)*/**</li><li>$1020/1370 (member/non-member) 10 Sessions (includes unlimited InBody Body Composition Assessment)*/**</li></ul><p><br>*UCSF Staff, Faculty, and Learners who are Fitness and Recreation members get 10% off the above pricing.<br>**Partner Training package prices available upon request.</p><h2 class="text-h3">InBody Body Composition Assessment</h2><p>Measure your body fat and muscle mass in minutes! This assessment is quick, easy, and highly accurate. Find out what you're made of, set goals to target the areas of your body that need work, and start tracking your progress month after month. Includes consultation with a personal trainer to better understand your results.&nbsp;</p><p><a href="https://ucsf.box.com/s/k4jqwhq7jgvsb8mpkldcimkxwxl93hza">Follow these guidelines to ensure accurate test results.</a>&nbsp;</p><p>Single test: $35/member, $45/non-member<br>3-pack: $90/member, $115/non-member<br>5-pack: $125/member, $160/non-member</p><p>To schedule your InBody assessment, contact our&nbsp;Assistant Director of Fitness Programs, Adrienne, at&nbsp;<a href="mailto:Adrienne.chambers@ucsf.edu">Adrienne.chambers@ucsf.edu</a></p><p><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/mobile-app">Learn how to purchase on our mobile app page</a>.&nbsp;</p><p>&nbsp;</p><p><strong>Sign Up</strong><br>To make an appointment for private training, contact the Pilates team at 415.514.4538 or contact our Assistant Director of Fitness Programs, Adrienne Chambers, at&nbsp;<a href="mailto:adrienne.chambers@ucsf.edu">adrienne.chambers@ucsf.edu</a>. Sessions can also be purchased on the Fitness and Recreation Mobile App - <a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/fitness-and-recreation-mobile-app">visit our web page for more information.</a></p><p>&nbsp;</p><h2 class="text-h3">Meet The Instructors</h2><p><img data-entity-uuid="94380266-8b78-48a5-bffa-49b50813d7e6" data-entity-type="file" alt="Andrea trainer" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Andrea-pilates.png.webp?itok=MCJUCSOs" width="255" height="255" class="image-style-full-size-width-1208"></p><p><strong>Andrea Rodriguez, Elite Instructor</strong></p><p><strong>Fitness Philosophy: </strong><em>"I believe that every day is a new opportunity to move your body with joy and vitality. Love the body you live in! My favorite quote from Joseph Pilates is, "Change happens through movement and movement heals."</em><br><strong>Specialization:</strong> Foot &amp; Gait, Myofascial Release, Pre/Post Natal, Post Rehab: active older adults for strength training and mobility. Injury prevention for athletes, dancers, swimmers, and folks with a sedentary lifestyle.&nbsp;<br><strong>Experience:</strong>&nbsp;Dance, Fitness, and Pilates Instructor with a combined 20+ years of experience teaching various fitness formats: Comprehensive Pilates (Reformer, Mat, Chair, Cadillac, Barrels, Springboard), Core Align, Barre. Extensive experience teaching in fitness boutique studios, community centers, gyms, collegiate dance departments, and private companies. Producer for the Zumba Fitness video game franchise, and Teaching Dance Artist.&nbsp;<br><strong>Credentials:</strong>&nbsp;Balanced Body Comprehensive Pilates, Core Align, TRX, Barre Above, Zumba®, CIRCL Mobility Training, Bachelor of Arts, University of California, Los Angeles (UCLA) World Arts Cultures &amp; Dance Department, M.F.A., University of Southern California (USC) Interactive Media Division.</p><p>&nbsp;</p><p><img data-entity-uuid="80b0dae8-46e1-4772-931d-7424682d9d66" data-entity-type="file" alt="Blanca Pilates Instructor" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Blanca-pilates.png.webp?itok=mVhpvDte" width="255" height="255" class="image-style-full-size-width-1208"></p><p><strong>Blanca Sobhan, Elite Instructor</strong></p><p><strong>Fitness Philosophy:&nbsp;</strong><em>"I believe movement is the foundation of a high-quality life. I focus on building a resilient 'engine'—a strong core—to help everybody move with power and confidence. I am passionate about 'functional longevity'—helping people build a body that supports them in daily life."</em><br><strong>Specialization: </strong>Men’s Functional Strength: Challenging the "Pilates is only for women" myth by focusing on flexibility, core stability, and injury prevention for men. Active Aging &amp; Senior Wellness: Focusing on balance, fall prevention, and specialized Pilates for osteoporosis and memory care. Clinical Populations &amp; Pre/Postnatal: Creating safe, effective movements for changing bodies, disabilities, and post-surgical recovery.<br><strong>Experience: </strong>16 years of personal practice and 7 years of professional experience teaching group or private classes. I pivot seamlessly from athletic, sweat-inducing workouts to gentle, restorative sessions. Whether we are working on the mat, chair, or reformer, my classes are fun, different every time, and deeply rooted in the joy of moving and feeling better.<br><strong>Credentials: </strong>NCPT, Nationally Certified Pilates Teacher by Balanced Body: Mat &amp; Reformer and Barre. ISSA: Functional Aging Group Exercise Certified. CPR/AED Certified: Adult, Child, and Infant.</p><p>&nbsp;</p><p><img data-entity-uuid="954f61de-982a-42cd-a33d-4e343fa09c0b" data-entity-type="file" alt="Elizabeth Snider Pilates Instructor" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Elizabeth%20Snider.png.webp?itok=x_hWSxDT" width="255" height="255" class="image-style-full-size-width-1208"></p><p><strong>Elizabeth Snider, Elite Instructor</strong></p><p><strong>Fitness Philosophy: </strong><em>"I use Pilates to train both body and mind, building awareness, strength, and resilience through focused, efficient movement. This approach encourages meeting the body where it is, moving with care, and exploring a variety of movement options that support meaningful, sustainable change. I believe that feeling and performing your best goes beyond the workout—supported by proper fueling, time in nature, recovery, meditation, rest, and sleep—allowing the body to recharge, adapt, and thrive."</em><br><strong>Specialization: </strong>Pilates and Yoga, Pilates and Yoga for Scoliosis, Pilates for the Performing Arts, Pilates Foot Management, Prenatal and Postpartum Yoga, Qigong, Somatic Stress Release, and movement practices informed by somatics and mindful alignment.<br><strong>Experience: </strong>Teaching Pilates and Yoga in academic and studio settings, supporting diverse populations through an inclusive and mindful approach to movement.<br><strong>Credentials: </strong>Nationally Certified Pilates Teacher, Experienced Registered Yoga Teacher, M.F.A. in Dance/Creative Practice, NASM Certified Sports Nutrition Coach, Prenatal and Postpartum Yoga Certified, AFAA Certified Personal Trainer.</p><p>&nbsp;</p><p><img data-entity-uuid="7cfcf6f5-20e4-4357-96b2-81e58997de26" data-entity-type="file" alt="Jackie Pilates Instructor" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Jackie-pilates.png.webp?itok=sLAdRlDz" width="255" height="255" class="image-style-full-size-width-1208"></p><p><strong>Jackie Rodriguez, Elite Instructor</strong></p><p><strong>Fitness Philosophy:</strong>&nbsp;<em>"I enjoy sharing the benefits and rewards of Pilates with my clients. Pilates is about a strong core, and this relates to a healthy body since all movements initiate from your center."</em><br><strong>Specialization:</strong>&nbsp;Works with athletes, including runners, swimmers, triathletes, and individuals training for sports, at all fitness levels. Utilizing Pilates movements specific to the client's needs, a targeted approach helps clients achieve greater flexibility, agility, alignment, and core strength.<br><strong>Experience:</strong>&nbsp;Primary focus on private, semi-private, and group classes. Trained in Ron Fletcher's Advanced Intensive Floor work, Pilates workshops with Master teacher Diane Severino, and workshops on scoliosis under the direction of Madeline Black.<br><strong>Credentials:</strong>&nbsp;Ron Fletcher® Comprehensive Certified, Pilates Method® Alliance Certified, TRX® Certified, PiYo Certified</p><p>&nbsp;</p><p><img data-entity-uuid="1bd7cc47-7328-4e37-b735-e9ebed6e328a" data-entity-type="file" alt="Lorna Pilates Instructor" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Lorna-pilates.png.webp?itok=0fTAGpKS" width="255" height="255" class="image-style-full-size-width-1208"></p><p><strong>Lorna Bernardo, Elite Instructor</strong></p><p><strong>Fitness Philosophy:</strong>&nbsp;<em>"Being physically fit and strong is empowering and isn't necessarily exclusive to those under 40. Fitness should be fun. Do exercise you enjoy. Find activities that challenge you physically. Work hard and focus on how good your body feels. You will be more likely to keep going. Maintain the fun factor by adding variety or working out with your friends. This is YOUR play time. It is sacred. The time you invest in keeping fit today will pay off in spades in aging gracefully."</em><br><strong>Specialization:</strong>&nbsp;Post-rehab strength training with an emphasis on rebuilding functional strength. Pre/postnatal clients, senior adult fitness, functional strength training, injury prevention and pain management, Parkinson's training, cancer training, and sports-specific training.<br><strong>Experience:</strong>&nbsp;15 years of experience as a Fitness Professional in Pilates and Personal Training with an emphasis on working with people with chronic injuries; Group Fitness, Small Group Fitness, Pilates, Pilates Mat, Senior Fitness, Cancer training, Parkinson's training<br><strong>Credentials:</strong>&nbsp;NPTI, NPTI Post Rehab Specialist, Balanced Body Pilates, Pre/Post Natal, Senior Fitness, SCW Group Fitness</p><p>&nbsp;</p><p><img data-entity-uuid="8b78afd9-7766-4ffc-969f-28dc19454ccd" data-entity-type="file" alt="Michelle S Pilates Instructor" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Michelle-pilates.png.webp?itok=745-Q6E2" width="255" height="255" class="image-style-full-size-width-1208"></p><p><strong>Michelle Singshi, Elite Instructor</strong></p><p><strong>Fitness Philosophy:</strong> <em>"My goal for every session is simple: help clients feel motivated, move better, and build strength safely. I focus on improving mobility, movement quality, and creating habits that carry over into daily life. Each person’s fitness journey is unique, so I tailor every session to what you need that day. I draw from Pilates, strength training, and functional movement to support your goals. I also recognize that progress is both physical and mental, and I coach with empathy and a growth mindset to help you achieve lasting results."</em><br><strong>Specialization: </strong>Correcting imbalances, reducing chronic pain, Aerial arts &amp; dance conditioning, Golf conditioning, Fascial movement, Lifestyle-based fitness and wellness<br><strong>Experience: </strong>Experienced in helping clients build strength and mobility post-surgery, reduce or eliminate chronic pain, and safely train with a variety of conditions, including spinal issues, heart and breathing conditions, pre/post-natal, vertigo, balance challenges, and hypermobility.<br><strong>Credentials:</strong> Stott Pilates Advanced Certification, NSCA Certified Strength &amp; Conditioning Specialist (CSCS), Adult CPR/AED, B.S. Biological Sciences</p><p>&nbsp;</p><p><img data-entity-uuid="1f5d8e85-b5a1-49e8-b6d7-d581bda3a628" data-entity-type="file" alt="Stephany Pilates Instructor headshot" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Stephany-pilates.png.webp?itok=QzOakFwN" width="255" height="255" class="image-style-full-size-width-1208"></p><p><strong>Stephany Heller, Elite Instructor</strong></p><p><strong>Fitness Philosophy: </strong><em>"Pilates is more than just a workout; it's a pathway to rediscovering strength, flexibility, and the deep inner core. My goal is to create a welcoming and supportive environment for seniors, athletes, and adults who spend their workday sitting at their desks. I'm excited to embark on this transformational journey with you, fostering a love for Pilates that empowers us all. Let's challenge ourselves, achieve our fitness goals, and celebrate every step of the way, no matter how small!"</em><br><strong>Specialization: </strong>My expertise spans various disciplines, from Cancer Exercise Counseling to specialized Pilates techniques for neurological conditions such as stroke and MS. Your session begins with promoting pelvic floor fitness and barefoot training, ensuring a comprehensive approach to overall wellness.<br><strong>Experience: </strong>With over 12 years of experience as a certified Pilates professional, I've dedicated my career to helping people unlock their potential through movement. My focus is on using innovative techniques to improve strength imbalances, manage sacroiliac joint pain, diastasis, or pelvic instability. You will experience a powerful combination of Pilates principles, such as core strengthening and control, with traditional therapeutic techniques, such as gait and balance training, to maximize functionality.<br><strong>Credentials: </strong>ACSM/ CETI: Cancer Exercise Counselor; Pilates: Pelvic floor fitness; Pesi: Functional movement, Sacroiliac joint pain; Fusion Pilates: Healing diastasis fascial tensioning; The Neuro Studio: Pilates for Neurological Conditions; EBFA- Barefoot Training; Power Pilates: Pilates for Seniors and Special Cases; Power Pilates/Quist: Comprehensive Apparatus Mat.</p><p>&nbsp;</p><p><img data-entity-uuid="68f00a2e-0121-44bb-b47e-e2456a366150" data-entity-type="file" alt="Ai Pilates Instructor" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Ai-pilates.png.webp?itok=KSDlqCZw" width="255" height="255" class="image-style-full-size-width-1208"></p><p><strong>Ai Kashii, Pro Instructor</strong></p><p><strong>Fitness Philosophy:</strong> <em>"I teach to help people better understand their bodies, build confidence through movement, and discover new ways to challenge themselves. My goal is to create classes that feel empowering, approachable, and fun, where clients feel supported as they explore strength, coordination, and potential."</em><br><strong>Specialization:</strong> Classical Pilates for beginners through advanced movers, with an emphasis on body awareness, confidence-building, and progressive movement.<br><strong>Experience: </strong>I’m a comprehensively trained Classical Pilates instructor with experience teaching group and private sessions<br><strong>Credentials:</strong> 450 hr Comprehensive Classical Pilates Certification, CPR/AED Certified</p><p>&nbsp;</p><p><img data-entity-uuid="2f70cbf2-4459-420a-a345-1e3b0218e38c" data-entity-type="file" alt="Ayane Pilates Instructor" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Ayane-pilates.png.webp?itok=xtz9L0MI" width="255" height="255" class="image-style-full-size-width-1208"></p><p><strong>Ayane Mochizuki, Pro Instructor</strong></p><p><strong>Fitness Philosophy:&nbsp;</strong><em>"I am passionate about creating a space where individuals can rediscover the joy of movement. Through Pilates, your body will experience movements that will feel rejuvenating and challenging, and its benefits will translate to your movements and experiences of daily life!"</em><br><strong>Specialization:&nbsp;</strong>injury prevention, sports-specific strength training (mainly gymnasts), post-rehab strength training<br><strong>Experience:</strong>&nbsp;Pilates mat group classes, Pilates privates focused on post-rehab training<br><strong>Credentials:</strong>&nbsp;Core Advancement Pilates Certified, Nationally Certified Pilates Teacher</p><p>&nbsp;</p><p><img data-entity-uuid="e9a44ea2-38fe-497e-9555-13b8315c1e5c" data-entity-type="file" alt="Justice Pilates Instructor" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Justice-pilates.png.webp?itok=A_PT-uF1" width="255" height="255" class="image-style-full-size-width-1208"></p><p><strong>Justice Shelton Mosley, Pro Instructor</strong></p><p><strong>Fitness Philosophy: </strong><em>"Pilates promotes balanced muscle development, core strength, and body awareness—all of which help people move better. I believe in getting people moving—especially the spine—in all directions to build strength, mobility, and long-term resilience."</em><br><strong>Specialization: </strong>I specialize in high-energy, music-driven Pilates grounded in functional movement and deep core engagement. My classes emphasize spinal articulation, posture, and body alignment to help clients feel stronger, lengthened, and more connected.<br><strong>Experience: </strong>I discovered Pilates while training and traveling throughout the Caribbean, Europe, and Latin America. After competing at the highest levels of sport—including playing football at Harvard and Vanderbilt, and time in the NFL with the Kansas City Chiefs—I was drawn to Pilates for its precision, control, and powerful mind-body connection.<br><strong>Credentials: </strong>Mighty Pilates Comprehensive Certification, B.A. in Economics – Harvard University, M.A. in Marketing – Vanderbilt University</p><p>&nbsp;</p><h2 class="text-h3">Pilates Policies</h2><p><a href="/fitnessrecreation/pilates-policies">View online &gt;&gt;</a></p><h2 class="text-h3">Contact</h2><p>Adrienne Chambers, Assistant Director, Fitness Programs<br><a href="mailto: Adrienne.chambers@ucsf.edu">Adrienne.chambers@ucsf.edu</a></p></div>

            <div class="clearfix text-formatted field field--name-field-overview field--type-text-long field--label-hidden field__item"><p>Gain total body strength, balance and core control. We provide a range of traditional and specialty instruction to meet your fitness goals and skill level.</p>

<article data-history-node-id="11" class="node node--type-section node--promoted node--view-mode-default clearfix">

            <h2 class="node__title">
        <a href="/fitness-and-recreation/recreational-sports" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">Recreational Sports</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-header field--type-entity-reference field--label-above">
    <div class="field__label">Header</div>
              <div class="field__item"><a href="/node/491" hreflang="en">FitRec Recreational Sports Hero</a></div>
          </div>

  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item">  <img loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/2026-02/FR-Pickleball-Group.jpg" width="5200" height="3467" alt="A group with three females and one male playing pickleball." />

</div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>Learn a new game, join a team, or fine-tune your talent. Recreational Sports offers a wide range of activities such as clinics, leagues and drop-in sports to meet your recreational needs.&nbsp;Join us to participate in exercise or play competitively!</p><p><br><a href="#drop-in"><strong>Drop-In Sports</strong></a>&nbsp; &nbsp; &nbsp; &nbsp;<a href="#leagues"><strong>Leagues</strong></a> &nbsp; &nbsp; &nbsp;<a href="#squash"><strong>Squash and Racquetball</strong></a>&nbsp; &nbsp; &nbsp; &nbsp;<a href="#gymnasium"><strong>Gymnasium Rentals</strong></a>&nbsp; &nbsp; &nbsp; &nbsp;</p><p>&nbsp;</p><p><img data-entity-uuid="d6c7cd84-d282-4b7b-bda0-8e9671cc08ca" data-entity-type="file" alt="Basketball players" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/BasketB-leag-204.jpg.webp?itok=xHZ9riZD" width="1208" height="706" class="image-style-full-size-width-1208"></p><h2><a class="ck-anchor" id="drop-in"></a>Drop-In Sports</h2><p>You don’t need a team to play – drop in to join us for some friendly competition. Our drop-in sports include Badminton, Basketball, Fustal (Indoor Soccer), Volleyball, Racquetball, Squash, and Pickleball. All skill levels are welcome. Drop-in sports are available to UCSF students and Fitness and Recreation members free of charge. Non-members can participate by purchasing a <a href="/fitnessrecreation/day-pass">Day Pass</a>.</p><p>For updated play times, view our gymnasium calendars:<br><a href="https://calendar.google.com/calendar/u/0/embed?src=pf3fokaod94hi0kn1cn4kas970@group.calendar.google.com&amp;ctz=America/Los_Angeles">Bakar Gymnasium at Mission Bay &gt;&gt;</a><br><a href="https://calendar.google.com/calendar/u/0/embed?src=d72r13cvbd8gottmca1fhue4ls@group.calendar.google.com&amp;ctz=America/Los_Angeles">Millberry Gymnasium at Parnassus &gt;&gt;</a></p><p>&nbsp;</p><p><img data-entity-uuid="46da3b2e-b347-4b85-a1ee-4f9d75140645" data-entity-type="file" alt="Game of volleyball" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/Volleyball-255.jpg.webp?itok=IXE3XwCb" width="1208" height="767" class="image-style-full-size-width-1208"></p><h2><a class="ck-anchor" id="leagues"></a>Leagues</h2><p>Feed your competitive spirit, socialize, be part of a team, and play your favorite sport! Get active by joining one of our Basketball, Volleyball, or Pickleball leagues as a team or as a free agent.<br><br><strong>Winter Leagues: January 5-March 26</strong><br><strong>Spring Leagues: April 6-June 19</strong><br><br><em><strong>Bakar Fitness and Recreation Center Leagues - Basketball:</strong></em></p><ul><li>Mondays: Open (Co-ed)</li><li>Tuesdays: Beginner/Intermediate</li><li>Wednesdays: Intermediate</li><li>Thursdays: Advanced</li></ul><p><br><em><strong>Millberry Fitness and Recreation Center Leagues</strong></em></p><ul><li>Tuesdays: Pickleball</li><li>Wednesdays: Volleyball</li><li>Thursdays: Beginner/Intermediate Basketball<br>&nbsp;</li></ul><p><strong>League Registration</strong><br>Registration for Spring Leagues is now open. Registration will close <strong>March 27, 2026</strong>.<br><br><em>New for Spring - Online registration at IMLeagues.com or the IMLeagues app.&nbsp;</em><br><br><strong>Create an IMLeagues Account</strong><br>1. Create an account online at <a href="https://www.imleagues.com/UCSF/Registration">https://www.imleagues.com/UCSF/Registration</a><br>2. You will be sent an activation email, click the link in the email to login and activate your IMLeagues account.&nbsp;<br>3. You should be automatically joined to the UCSF network - if not, you can search schools by clicking the "Schools" link.<br><br><strong>Sign up For a League</strong><br>1. Log in to your IMLeagues.com account.<br>2. Click the "Get Involved" button at the top right of your User Homepage.<br>3. The current sports will be displayed - click on the sport you wish to join.<br>4. You can join the sport one of three ways: Create a team, Join a team, Join as a Free Agent.<br><br>For assistance, please e-mail&nbsp;<a href="mailto:recreational.sports@ucsf.edu">recreational.sports@ucsf.edu</a>.<br><br><strong>League Fees</strong><br>Team fees are paid online. Captains will receive the link to pay online once registration closes.<br>Please note there is no registration fee for teams made up of all UCSF Students.</p><p><em>Basketball</em></p><ul><li>UCSF Student and Fitness Center Member Team Fee (must have at least one student or member on the team): $875</li><li>General Public Team Fee: $980&nbsp;&nbsp;</li></ul><p><br><em>Volleyball</em></p><ul><li>UCSF Student and Fitness Center Member Team Fee (must have at least one student or member on the team): $700</li><li>General Public Team Fee: $750<br>&nbsp;</li></ul><p><em>Pickleball</em></p><ul><li>UCSF Student (must have at least one student on the team): $120</li><li>Fitness Center Member Team Fee (must have at least one member on the team): $180</li><li>General Public Team Fee: $240</li></ul><p><br><em><strong>Fall Bakar Fitness and Recreation Center League Schedules (Mission Bay)</strong></em><br><a href="https://docs.google.com/spreadsheets/d/1yh1l_jeKZxAbiyG_4iTSy6MtfAZm7N_BZtsh7xqJQHI/edit?usp=sharing">Tuesdays: Beg/Intermediate Basketball&nbsp;(Court 1)</a><br><a href="https://docs.google.com/spreadsheets/d/1qoxyY3Pr-9-gyXcokN3dZqyK-329EeRfw2empbJgxsI/edit?usp=sharing">Tuesdays: Beg/Intermediate Basketball (Court 2)</a><br><a href="https://docs.google.com/spreadsheets/d/1ChFoyg1wRReLL3dtUuOtcykz9b_I7CpZA568LLQRlMM/edit?usp=sharing">Wednesdays: Intermediate Basketball</a><br><a href="https://docs.google.com/spreadsheets/d/128CAWJAJxjyyDW_D4tCoUUNJHw9sR_Xywci74cURsR0/edit?usp=sharing">Thursdays: Advanced Basketball</a>&nbsp;<br><br><em><strong>Fall Millberry Fitness and Recreation Center Leagues</strong></em><strong> (Parnassus)</strong><br><a href="https://docs.google.com/spreadsheets/d/1ug49Guh9e8QkN7ulKc_3do7nUR_nqgc6Q_yxqE3HO7c/edit?usp=sharing">Tuesdays: Beg/Int/Adv Pickleball (Teams of 2-4 players)</a><br><a href="https://docs.google.com/spreadsheets/d/1i_PjfGKZftfsjI_OzUcsbvUKd_db_DGH1ViN9JlZsgo/edit?usp=sharing">Wednesdays: Open Volleyball (Co-Ed)</a><br><a href="https://docs.google.com/spreadsheets/d/15wia0fI9ZbNGLPl_7XUfaAPu6O3cMrr4dOA9FZchiAA/edit?usp=sharing">Thursdays: Beg/Intermediate Basketball</a><br><br><br><strong>League Playoffs</strong></p><p>Generally, the top four teams in each league will be taken to the playoffs. Occasionally, fewer teams will be taken from a small league (four teams or less). Teams must have a 5.5 Spirit of the Game rating or higher to qualify for the playoffs (scale of 0-8). Any teams with 3 forfeits in a season will be disqualified from the playoffs.</p><p>&nbsp;</p><p><img data-entity-uuid="5671d06f-496c-42d9-8a47-06b4661ebf05" data-entity-type="file" alt="students playing racquetball" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/racquetball.jpg.webp?itok=T4LIXpxq" width="1208" height="805" class="image-style-full-size-width-1208"></p><h2><a class="ck-anchor" id="squash"></a>Squash and Racquetball</h2><p>Fitness and Recreation members can book squash and racquetball courts in advance.</p><p><strong>Booking a Court</strong></p><ul><li>All members can book on the app, over the phone, or in-person (you must have an email address on file with Member Services)</li><li>Bookings can be made starting at 10:00 am, 3 days in advance</li><li>Only one booking is allowed per day</li><li>You will be sent a reminder e-mail 24 hours before your booking</li><li>Reservations must be canceled at least 2 hours prior to the booking start time</li><li>Reservations must be booked under your individual account.</li></ul><p>&nbsp;</p><p><strong>Check-in</strong></p><ul><li>Check in at the front desk up to 30 minutes before or 30 minutes after the booking start time</li><li>If check-in does not take place within this time-frame, the booking will be recorded as a no-show<br>&nbsp;</li></ul><p><strong>UCSF Box League</strong><br>The UCSF Box League is a monthly squash league for Bakar Fitness &amp; Recreation Center at UCSF Mission Bay members only. All levels of players from beginner to advanced can participate in the league. Players are grouped into boxes of 4 or 5 players based on playing ability based on the previous month’s ranking. Everyone plays round-robin matches with all their box-mates, which amounts to playing 3 to 4 matches per month depending on the number of players in your box. At the end of every month, the league is refreshed based on the following rules - top 2 players from each box move to a higher box and bottom 2 move to a lower box while the 3rd position player stays in the same box. This results in everyone playing at least 2 or more different players every month. The matches can be scheduled per the players’ convenience. The box is managed through the US Squash web portal with the scores being entered on&nbsp;<a href="http://www.ussquash.com/">www.ussquash.com</a>&nbsp;and hence a free US Squash membership is a requirement.</p><p>If you would like to join the league for any given month,&nbsp;<strong>send the following to&nbsp;</strong><a href="mailto:recreational.sports@ucsf.edu">recreational.sports@ucsf.edu</a><strong>&nbsp;before the end of the previous month.</strong>&nbsp;For example, if you want to sign up for July, the following information is required by the last day of June.</p><p><strong>1. US Squash membership number</strong>&nbsp;(if you don’t have one, visit&nbsp;<a href="http://www.ussquash.com/">www.ussquash.com</a>&nbsp;and create free account. Note down membership number and send. Add Bakar Fitness and<br>Recreation Center as your home facility.)</p><p><strong>2. Agreement in the form of “yes”</strong>&nbsp;that you will be added to the Google Groups e-mail list to receive weekly updates. There is no form, just a “yes” via e-mail is sufficient. This is a requirement to participate.</p><p><strong>3. Playing ability</strong>&nbsp;(beginner / intermediate / advanced) - Required to place you in the appropriate box. If you already play at Bakar Fitness Center, you can let us know the names of your playing partners and how you play compared to them for us to assess which box to put you in. The more information you can provide about your playing history and playing style, the greater the likelihood that you will be placed in the right box.</p><p><strong>UCSF Squash Club (NorCal Squash League)</strong></p><ul><li>Reservations made before the 72-hour open window will be made under the UCSF member’s name</li><li>If more than 3 courts need to be booked in advanced, the UCSF member must provide the name of another UCSF member to reserve the court</li><li>If a member has 3 or more court reservations already booked, they will not be able to reserve any other future bookings</li><li>Members under the court reservation will be held accountable for checking in to their court reservations, the same no-show policy will apply</li><li>Only 1 court can be reserved for up to 3 reservations per day ahead of the 72 hr window</li><li>Names of guests must be provided at least 24 hours in advanced</li><li>Guests will have access to the squash courts ONLY</li><li>Contact&nbsp;<a href="mailto:evan.richardson@ucsf.edu">evan.richardson@ucsf.edu</a>&nbsp;with any questions</li></ul><p>&nbsp;</p><p><img data-entity-uuid="a669be8b-acd5-40e3-ae93-81d9bf934f5f" data-entity-type="file" alt="Bakar gymnasium" data-image-style="full_size_width_1208" loading="lazy" src="/sites/campuslifeservices.ucsf.edu/files/styles/full_size_width_1208/public/inline-images/bakar%20gymnasium.jpg.webp?itok=qomDAppK" width="1208" height="814" class="image-style-full-size-width-1208"></p><h2><a class="ck-anchor" id="gymnasium"></a>Gymnasium Rentals</h2><p>Gymnasium rentals are available at Bakar Fitness Center at Mission Bay and Millberry Fitness Center at Parnassus.</p><p><strong>Hourly Rates</strong></p><p><strong>UCSF Students</strong><br>Single Court: $195<br>Full Court: $460</p><p><strong>UCSF Affiliates</strong><br>Single Court: $220<br>Full Court: $525</p><p><strong>Schools/Non-Profits</strong><br>Single Court: $220<br>Full Court: $525</p><p><strong>Private/Corporate Customers</strong><br>Single Court: $275<br>Full Court: $660</p><p><em>Must provide Commercial Form General Liability Insurance (contractual liability included) with minimum amount equal to $2,000,000 per occurrence and general aggregate of $5,000,000. The coverages referred to above shall include licensor as an additional insured. The certificate must name the “Regents of the University of California” as an additional insured.</em></p><h2>Rec Sports Policies</h2><p><a href="/fitnessrecreation/rec-sports-policies">View our rec sports policy online &gt;&gt;</a></p><h2>Contact</h2><p>Evan Richardson, Recreational Sports Manager<br><a href="mailto:Evan.richardson@ucsf.edu">Evan.richardson@ucsf.edu</a>, 415.514.4581</p><p>&nbsp;</p></div>

        <a href="/fitness-and-recreation/news/member-appreciation-month" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">Member Appreciation Month</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10311" hreflang="en">FR-Member-Appreciation.jpg</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>February is all about you! To thank you for being part of our community, we’re celebrating Member Appreciation Month with special perks and experiences: &nbsp;&nbsp;</p><ul><li><strong>Guest Pass Giveaway:</strong>&nbsp;Pick up two guest passes at the Member Services Desk by February 28.<br>&nbsp;</li><li><strong>$0 Enrollment Add-ons: </strong>Add a member to your account with no enrollment fee. <em>One adult add-on per account (does not need to be in the same household).</em><br>&nbsp;</li><li><strong>Bring-a-Friend Fridays:&nbsp;</strong>Bring up to two guests—no pass required. <em>Guests must be 18+ with a valid ID and waiver.</em><br>&nbsp;</li><li><strong>Free Kettlebell Clinics at Mission Bay - February 19, 24, 26:</strong>&nbsp;Learn proper kettlebell swing form, common mistakes, and why it’s such a powerful full-body exercise. Led by Christopher, Certified Personal Trainer. Reserve your spot in the app. Start booking 72 hours in advance - multiple times available!<br>&nbsp;<ul><li>February 19: 10 am, 10:15 am, 10:30 am, 10:45 am</li><li>February 24: 8 am, 8:15 am, 8:30 am, 8:45 am</li><li>February 26: 7 am, 7:15 am, 7:30 am, 7:45 am<br>&nbsp;</li></ul></li><li><strong>Free 360 Core Clinics at Parnassus - February 18, 23, 25:&nbsp;</strong>Use the back extension machine to assess core strength and movement patterns. Learn how to properly engage your core, glutes, and back&nbsp;to protect your lower back, prevent injury, and build a stronger, more stable core. Led by Jayden, Certified Personal Trainer.&nbsp;Reserve your spot in the app. Start booking 72 hours in advance - multiple times available!<br>&nbsp;<ul><li>February 18: 10 am, 10:15 am, 10:30 am, 10:45 am</li><li>February 23: 4:15 pm, 4:30 pm, 4:45 pm, 5 pm</li><li>February 25: 11 am, 11:15 am, 11:30 am, 11:45 am<br>&nbsp;</li></ul></li><li><strong>Group Fitness Skills Series, February 24-26:&nbsp;</strong>This series is our way of investing in YOU - your confidence, your comfort, and your long-term success in class. Check the class schedule from February 24-26 for 30-minute <strong>Cycling</strong>, <strong>Strength</strong>, and <strong>Yoga</strong>&nbsp;skills-focused classes led by our expert instructors, designed to help you get more out of every workout.&nbsp;<br><br><em>Cycling Skills:</em>
This focused session breaks down essential cycling skills to help you ride more efficiently and confidently. We will cover bike setup, posture, pedal stroke, resistance control, and cadence. Expect guided practice and instructor feedback so you can apply these skills to every ride, improve power, and reduce discomfort or injury.
<br><br><em>Strength Skills </em>(Athletic conditioning, LM Grit™, LM BodyPump™):
This class is designed to improve how you move and lift. You will practice foundational strength patterns such as squats vs deadlifts, cleans, flies vs presses, and front squat with an emphasis on proper form, breathing, and control. The goal is to build strength safely, move with intention, and feel more confident in strength-based classes.
 
<br><br><em>Yoga Foundational Skills:</em>
This focused session breaks down essential yoga skills to help you move with greater comfort and confidence in any yoga class. You will practice breath, alignment, transitions, and common postures with clear demonstrations and instructor feedback. The class introduces vinyasa, yin, and restorative foundations, including effective use of props for support, mobility, and relaxation.&nbsp;<br><br>
</li></ul></div>

        <a href="/fitness-and-recreation/news/top-five-reasons-join-sports-league-winter" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">Top Five Reasons to Join a Sports League This Winter</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10106" hreflang="en">FR-leagues.jpg</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>As winter sets in, UCSF Fitness &amp; Recreation is encouraging students, staff, and community members to discover new ways to stay active, connect with others, and beat the seasonal slowdown through its Recreational Basketball, Volleyball, and Pickleball Leagues.</p><p>Recreational leagues aren’t just about friendly competition, they’re designed to help our community thrive physically, socially, and mentally. <strong>Evan Richardson,&nbsp;UCSF Rec Sports Manager</strong>, shares the top five reasons to join a sports UCSF Recreational League:</p><p><strong>1. Social Connection &amp; Networking</strong><br>Leagues are a great way to meet people and gain lifelong friends. We have a lot of participants from different teams who meet other players and join our league or discover new leagues to join, helping them stay socially connected within our UCSF community.&nbsp;</p><p><strong>2. Physical Health</strong><br>Regular participation in league play helps members maintain their physical health goals. Being active each week through sports provides a fun and engaging way to stay fit.</p><p><strong>3. Skill Development</strong><br>Whether you’re new to a sport or an experienced player, league participation allows you to continue developing and improving your skills.</p><p><strong>4. Mental Health Benefits</strong><br>Playing sports offers a healthy outlet for stress and anxiety. It’s a great way to unwind, recharge, and boost confidence, giving participants a mental break from the demands of everyday life.</p><p><strong>5. Inclusive Environment</strong><br>Our leagues are designed to welcome participants of all skill levels. Whether you’re just starting out or a seasoned athlete, there’s a league and sport for everyone.</p><p>League registration opens December 8 for our upcoming winter season (January 5-March 26) . Learn more on our <a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/recreational-sports">Rec Sports web page</a>.</p></div>

            <h2 class="node__title">
        <a href="/fitness-and-recreation/news/joey-convento-one-soldiers-journey-service-and-leadership" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">Joey Convento, One Soldier’s Journey of Service and Leadership</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/10046" hreflang="en">Untitled (7).png</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>You don't have to be a UCSF Fitness and Recreation member to know Joey Convento, sales specialist. His big smile and caring nature draw people in to chat. If there's a tabling event with a reserved spot for UCSF Fitness and Recreation, he will be there sharing the core of fitness, giving away swag, and inspiring fitness.&nbsp;</p><p>What you probably do not know is that Convento is a veteran who served in the U.S. Army for 25 years. We reached out to him to learn more about his service, values, and memories.&nbsp;</p><p>&nbsp;</p><p><strong>What inspired you to join the military?</strong></p><p>I was inspired to join the Army out of a strong sense of duty and a desire to serve my country in a meaningful way. Becoming a Combat Engineer offered the opportunity to contribute directly to mission success, combining technical skill, problem-solving, and physical grit to support and protect others on the ground.</p><p>&nbsp;</p><p><strong>Can you share one of your most memorable experiences from your time in service?</strong></p><p>One of my most memorable experiences was completing a complex route clearance mission under tough conditions. As a Combat Engineer, every operation required precision and teamwork knowing that the safety of others depended on the work we did. Those moments reinforced the importance of trust, training, and staying calm under pressure.</p><p>&nbsp;</p><p><img src="/sites/campuslifeservices.ucsf.edu/files/inline-images/Resize%20image%20project.png" data-entity-uuid="af135bd0-1f60-4424-8049-2bb7098151cb" data-entity-type="file" alt="Two people in camouflage smiling " width="878" height="494" loading="lazy"></p><p>&nbsp;</p><p><strong>What’s something you learned in the military that still shapes how you work or live today?</strong></p><p>The Army taught me discipline and adaptability, two qualities that guide everything I do. In the field, no plan ever goes exactly as expected, so you learn quickly to think critically, stay focused, and keep moving forward no matter what. That mindset helps me tackle challenges in both my professional and personal life.</p><p>&nbsp;</p><p><strong>How did your service change your perspective on teamwork or leadership?</strong></p><p>Serving as a Combat Engineer taught me that leadership isn’t about rank, it’s about responsibility. You learn to lead by example, earn respect through your actions, and trust your team with your life. Teamwork in the Army means complete reliance on one another, every role matters, and every person counts.</p><p>&nbsp;</p><p><strong>What does being part of the veteran community mean to you?</strong></p><p>Being part of the veteran community is a deep source of pride and connection. There’s an unspoken understanding among those who’ve served, a bond built on shared sacrifice and shared purpose. It’s a reminder that even though we’ve taken off the uniform, our sense of service and camaraderie never fades.</p><p>&nbsp;</p><p><strong>What’s something you wish more people understood about veterans?</strong></p><p>I wish more people understood that veterans bring more than just military experience, we bring resilience, leadership, and a mission-first mindset that translates to any environment. Many of us continue to serve our communities in different ways, driven by the same values we learned in uniform.</p><p>&nbsp;</p><p><strong>How do you like to commemorate Veterans Day personally?</strong></p><p>On Veterans Day, I take time to reflect and honor those who served before me, alongside me, and those still in harm’s way. I often connect with fellow veterans to share stories and gratitude, it’s a day to appreciate the sacrifices made and to remember why we served.</p><p>&nbsp;</p><p><strong>What’s a small tradition or memory from your service that still makes you smile?</strong></p><p>I still smile thinking about the bond within my unit, the humor that kept us grounded during long missions, the shared meals in the field, and the sense of family that only those who’ve served together can understand. Those small moments carried us through the toughest days.</p><p>&nbsp;</p><p><strong>Is there a story or piece of advice from your time in uniform that you often find yourself sharing with others?</strong></p><p>One lesson I carry with me and often share, is that preparation and teamwork save lives. In the Army, especially as a Combat Engineer, success depended on how well we worked together and how much we trusted our training. That principle applies everywhere: stay ready, take care of your people, and never stop learning.</p></div>

            <h2 class="node__title">
        <a href="/fitness-and-recreation/news/meet-outdoor-instructor-who-changing-how-we-think-about-nature" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">Meet the Outdoor Instructor Who Is Changing How We Think About Nature</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/9716" hreflang="en">FitRec_Clara Schroeder headshot.jpg</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p><em>A conversation with Fitness and Recreation Outdoor Instructor, Clara Schroeder.</em></p><p><strong>What do you really do at CLS?</strong></p><p>My official job title is Outdoor Instructor at <a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/outdoor-programs">UCSF's Fitness and Recreation Outdoor Program</a>. I take students, staff, and anyone connected to UCSF who buys the <a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/ucsf-rec-pass">outdoor rec pass</a> on trips. We do kayaking, camping, backpacking, and hiking. It’s pretty casual, nothing too strenuous. We have two seasons, from January through June and then from August through November. We usually do one or two-night trips, mostly on weekends.</p><p><strong>Can you give an example of the location?</strong></p><p>My last trip was to Pinnacles National Park, which is really close. Pinnacles is two and a half hours south of us. It looks like the desert, and they have the biggest population of California condors, which are the biggest birds that we have here. They look like turkey vultures but are like three times as big. Their wingspan is nine feet long at adult size! Pinnacles is one of the only places you can see them easily.</p><p>The hike is great. We go up into the peaks. It's one of my favorites. We also go near Stinson Beach and stay in cabins up there. That's one of the best ones. Yosemite, Tahoe, Big Sur, Mendocino…</p><p>We provide all the gear, all the food, all the guiding, obviously, all the reservations, because it's impossible to get camping reservations in most of California.</p><p>&nbsp;</p><figure role="group" class="caption caption-img">
<img alt="A group stands on a pier with paddles raised up" data-entity-type="file" data-entity-uuid="8373c307-fb96-409d-83ee-636646e7e357" height="1200" src="/sites/campuslifeservices.ucsf.edu/files/inline-images/IMG_3253%20%281%29.jpeg" width="1600" loading="lazy">
<figcaption>Schroeder leads a group in a Kayaking activity in Monterey, October 2024.</figcaption>
</figure>
<p>&nbsp;</p><p><strong>How long have you worked at UCSF?</strong></p><p>A little over a year, so three seasons. I got hired on May 9, 2024 and led my first trip over Memorial Day weekend in Santa Cruz.</p><p><strong>What is your favorite part of the job?</strong></p><p>For me, as an ecotherapist, it’s seeing the impact that spending time outside with others has on the students and the people who go on these trips. They usually arrive late on a Friday because they have class. They have labs. They are super busy. So, they're finishing up their week, getting to the spot that we're in, and we're all prepared for them.&nbsp;</p><p>They’re in high-energy stress and really needing the break. By Sunday morning, which is usually when we end our trips, they're all talking about things that are not related to work or class.</p><blockquote><p>Just feeling the energy shifts over the weekend, I love seeing that impact and the connection, the joy, the relaxation, the emotional, mental, and physical health benefits, which is something that I track personally because of my background in psychology.&nbsp;</p></blockquote><figure role="group" class="caption caption-img">
<img alt="A group hikes down a trail" data-entity-type="file" data-entity-uuid="f5e9f60a-0c67-4576-8c0c-42b9f1988650" height="878" src="/sites/campuslifeservices.ucsf.edu/files/inline-images/1713904071678.jpeg" width="1170" loading="lazy">
<figcaption>Schroeder leading an Earth Day group nature connection workshop at a private equestrian ranch in the SF North Bay.</figcaption>
</figure>
<p>&nbsp;</p><p><strong>For folks who don't know, what is an ecotherapist?</strong></p><p>Ecotherapy is the idea that nature is a healing place and can be a source of support, so I tend to do that through the coaching lens. I work with nonclinical populations, sometimes people in leadership positions, sometimes individuals who are going through or have gone through some kind of transition in their lives. We basically do some self-development process outside. Sometimes I work remotely as well with people on their nature connection. It's the practice of well-being through connecting with nature and the natural world.</p><p><strong>How do you bring ecotherapy to the trips you lead?</strong></p><p>Sometimes, if the group wants it or it's a small enough group and I have enough time, I will lead a nature meditation in the morning. So, we'll wake up and do that first, then have a little pancake breakfast.&nbsp;</p><p>The conversations are really interesting, and they reflect on the role that nature has in their life and how they could include it more. Just by having these conversations, it ripples out to their communities.</p><p>&nbsp;</p><figure role="group" class="caption caption-img">
<img alt="A woman stands on a trail wearing a hat and smiling" data-entity-type="file" data-entity-uuid="d721de1f-a1fc-45f2-be3b-7a291bc69ca5" height="1200" src="/sites/campuslifeservices.ucsf.edu/files/inline-images/IMG_3529%20%281%29%20%281%29.jpeg" width="1600" loading="lazy">
<figcaption>Schroeder leading a camping trip at Steep Ravine cabins, November 2024.</figcaption>
</figure>
<p>&nbsp;</p><p><strong>Where'd you grow up?</strong></p><p>I grew up primarily in Europe. My parents are French German. I was born in Asia, in Taipei.&nbsp;</p><p>I've lived in six countries before I turned 16.&nbsp;</p><p>I made my way to California halfway through high school and have stayed in the Bay Area since, minus grad school. Identity wise, “French Californian” is what I tend to tell people.</p><p><strong>How has living in so many different places during your formative years made you the person you are today, and informed your approach to these trips?</strong></p><p>I think when you're uprooted a lot, geographically speaking, as I was, you build a lot of resilience and adaptability, which, honestly, these trips also train you to do.&nbsp;</p><p>I had to rely on my skills of observation and my skills of cultural understanding to survive because I was moving from countries where I didn't really have the language or the local knowledge of the culture.&nbsp;</p><blockquote><p>It's about really learning to trust yourself, which I think you have to do when you get put in a situation that's uncomfortable</p></blockquote><p>When you go outdoors, first, I want to acknowledge that not everyone is going to be comfortable, and not everyone grew up feeling like the outdoors was a safe, welcoming, and inclusive space for them.&nbsp;</p><p>But whatever background you're coming from, you learn new skills. You learn to play with the threshold of what's comfortable and what's a good edge and what's an edge that's too much. I think nature offers different experiences that we don't get when we sit in our offices, when we sit in front of our computers, and we learn things about ourselves.</p><p>&nbsp;</p><figure role="group" class="caption caption-img">
<img alt="A view of a ravine overlooking the ocean" data-entity-type="file" data-entity-uuid="dae042d6-5d75-47b7-9f93-c5ef21f8aa16" height="3024" src="/sites/campuslifeservices.ucsf.edu/files/inline-images/IMG_3695%20%281%29.jpeg" width="4032" loading="lazy">
<figcaption>The view from the Steep Ravine camping trip, November 2024.</figcaption>
</figure>
<p>&nbsp;</p><p><strong>What did you do before coming to Campus Life Services?</strong></p><p>I became an entrepreneur, right out of grad school. I studied psychology and became certified as an ecotherapist. And from there, I started leading people in sessions, and retreats outside.&nbsp;</p><p>I want to help people reconnect with nature and themselves, to improve their lives and the planet's future — our common future. This is part of why I wanted to share more of my writing with people.&nbsp;</p><p>I started to write a <a href="https://www.claraschroeder.com/book">book</a> about re-naturing, so that people know more about ecotherapy, and how they can cultivate their own relationship and connection with nature, just like I do in a different way when I'm guiding.</p><p><strong>What does “re-nature” mean to you? Why did you choose that title?</strong></p><figure role="group" class="caption caption-img align-right">
<img alt="Book cover shows leaf and the words Re-Nature" data-entity-type="file" data-entity-uuid="1724376d-2f74-496f-9f3f-f477ca9c34fc" height="608" src="/sites/campuslifeservices.ucsf.edu/files/inline-images/81plOlG8wIL._SY522_.jpg" width="380" loading="lazy">
<figcaption>Schroeder's book <em>Re-Nature: How Nature Helps Us Feel Better and Do Better</em></figcaption>
</figure>
<p>Renaturing is spending time intentionally connecting with the natural world. It’s more of a present moment, intentional practice of being outside and letting your nervous system auto-regulate just by stepping out and seeing a broader horizon versus your computer screen, that is so focused.</p><p>I'm all for outdoor recreation and exercising, obviously, but also, there's something to be said about going for a walk by yourself without any music in your ears, no phones, no distractions. The research on mindfulness is incredible.</p><p>I'm a spiritual person, and my relationship with nature is a part of that. So that's one lens, but there's also a very, like, pragmatic, scientific, more corporate-focused lens. The book combines all these different modalities, the scientific benefits of connecting with nature (there are so many), and the productivity and creativity metrics for employees who spend time outside in nature during the day and after their workday. It’s so interesting.</p><p>&nbsp;A global <a href="https://ucsf.box.com/s/qfk29updhy8fvet3rln8m1eolwm6z3gv">study</a> cited by <a href="https://hbr.org/2023/07/research-a-little-nature-in-the-office-boosts-morale-and-productivity">Harvard Business Review</a> showed that having natural features in a work environment increased employee creativity by 15% and productivity by 6%.</p><blockquote><p>We are a part of nature, and if we don't do something about it now and recognize that we are and re-nature ourselves and our lives, we are going towards an auto-destructive pathway. But it doesn't have to be a doom and gloom narrative, if we just open our hearts up a little bit to the healing potential.</p></blockquote><p>Schroeder’s book, <em>Re-Nature: How Nature Helps Us Feel Better and Do Better</em>,&nbsp;is coming out on October 9. To pre-order, you can visit <a href="https://www.claraschroeder.com/book">Schroeder's website</a>. To learn more about upcoming Outdoor Programs, visit the <a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/backpacking-and-camping">Fitness and Recreation website.</a></p></div>

            <div class="clearfix text-formatted field field--name-field-overview field--type-text-long field--label-hidden field__item"><p>Clara Schroeder is not just an Outdoor Instructor, but an ecotherapist and author, who hopes to change how people look at - and experience nature.&nbsp;</p>
