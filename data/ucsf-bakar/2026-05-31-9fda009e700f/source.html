            <h2 class="node__title">
        <a href="/fitness-and-recreation/news/fall-fit-fest" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">Fall Fit Fest</span>
</a>
      </h2>
        
      </header>
  <div class="node__content clearfix">
    
  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">
    <div class="field__label">Featured image</div>
              <div class="field__item"><a href="/media/9931" hreflang="en">fitfestwebpage.jpg</a></div>
          </div>

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p><em>A special event for UCSF Faculty, Staff and Students.</em></p><p><strong>Location: Bakar Fitness Center (Mission Bay) Rooftop</strong><br><strong>Date: Wednesday, November 5, 11:00 am-2:00 pm!&nbsp;</strong><br><br><em>The event is on rain or shine! In the event of rain, the event will be held in the Bakar Gymnasium on the 4th floor.</em><br><br>Join UCSF Fitness and Recreation to celebrate movement, wellness, and community and discover how we can help you stay active and inspired this fall. Highlights include:</p><ul type="disc"><li>Swag bag for all attendees (while supplies last), giveaways and raffles</li><li>Exclusive offers</li><li>Complimentary two-week membership and two guest passes. (Can't make the event? <a href="https://onlinejoin.abcfitness.com/signup/plan?club=31627&amp;promo=14-day+trial&amp;planId=549afe1a7c164f4fbf07937dd988b06c">Get your trial membership now!</a>)</li><li>Fitness challenges, sports games, and sample fitness classes - come dressed to move!</li><li>Live DJ and photo booth</li><li>Body composition testing and nutrition consulting</li><li>Special guest - Nash, UCSF Police therapy dog</li><li>And more!</li></ul><p><br><strong>Fitness Challenges and Activities</strong><br>Dress to move and take part in challenges throughout the day - battle ropes, pull-ups, agility, basketball, and pickleball challenges. Participate with our Fitness Passport to redeem for swag items, or complete the passport for a chance to win an Apple Watch or Theragun.</p><p>&nbsp;</p><p><strong>Physical Fitness and Injury Prevention + Q&amp;A with Dr. Nirav Pandya</strong> (11:30 am-12:00 pm in the 4th Floor Gymnasium)<br>*Space is limited, pre-registration is recommended.<br><a href="https://www.eventbrite.com/e/dr-nirav-pandya-speaker-tickets-1839053501529?aff=oddtdtcreator">Register &gt;&gt;</a><br>Dr. Nirav Pandya is a UCSF Health pediatric orthopedic surgeon specializing in sports medicine for young athletes. He is the Vice Chair and Division Chief of Pediatric Orthopedics and the Director of the UCSF Center for Sports Medicine for Young Athletes.&nbsp;His research includes single-sport specialization in young athletes and improving outcomes for their injuries, and he has authored over 60 peer-reviewed publications. In addition, he often provides expert commentary on NBA injuries and team performance for outlets like NBC Sports Bay Area.</p><p>&nbsp;</p><p><strong>Try Something New</strong></p><ul><li>Relax and recharge in our<strong> massage chairs.</strong></li><li>Take advantage of a free <strong>body composition test </strong>at the Personal Training booth and be entered into a raffle to win a spot in a Strength Training Clinic on November 13 at 4:00 pm (Mission Bay). <a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/personal-training">Learn more about Personal Training &gt;&gt;</a></li><li>Try the <strong>spine corrector</strong> at the Pilates booth and be entered into a raffle to win a group Pilates Reformer class for you and four coworkers. <a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/pilates">Learn more about Pilates &gt;&gt;</a></li><li>Challenge yourself with a <strong>free F45 Training</strong> <strong>3-class trial</strong>. <a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/f45-training">Learn more about F45 &gt;&gt;</a></li><li>Try a <strong>Cycling class</strong> (11:30 am, 12:30 pm, 1:30 pm - space is limited) and learn how to get fitted for a cycling bike. <a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/group-fitness">Learn more about Group Fitness &gt;&gt;</a></li><li>Learn more about UCSF <strong>Outdoor Programs and Rec Pass</strong> and be entered into a raffle to win a free Outdoor Programs trip. <a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/outdoor-programs">View our Outdoor Programs page &gt;&gt;</a></li><li>Meet our aquatics team, view the pool schedules, and take advantage of a free month of <strong>Masters Swimming</strong> when you sign up for a membership. We'll also be raffling off one complimentary 30-minute swim lesson! <a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/aquatics">Learn more about Aquatics &gt;&gt;</a></li><li>Join in some friendly <strong>Rec Sports competitions</strong> and learn about the new <strong>complimentary drop-in sports</strong> program for UCSF Faculty and Staff offered the first week of each month. Sign up your coworkers for a <strong>staff pickleball tournament! </strong><a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/recreational-sports">Learn more about Rec Sports &gt;&gt;</a></li><li><strong>Nutrition consultation</strong> with a UCSF Registered Dietitian.</li></ul><p>&nbsp;</p><p>For any reasonable accommodations, contact Fernando Hernandez by emailing <a href="mailto:fernando.hernandez@ucsf.edu">fernando.hernandez@ucsf.edu</a> as soon as possible.</p></div>

        <a href="/node/206" rel="bookmark"><span class="field field--name-title field--type-string field--label-hidden">What can I do on the mobile app?</span>
</a>
