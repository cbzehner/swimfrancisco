      <h1 class="page-title">Millberry Fitness Center at UCSF Parnassus</h1>

  <div class="field field--name-field-card-image field--type-entity-reference field--label-above">

            <div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><p>In the heart of the vibrant medical center and campus at UCSF Parnassus, the Millberry Fitness &amp; Recreation Center has long offered a venue for medical students, staff, faculty and surrounding neighbors to work out and relax. Visitors to our fitness center enjoy the intimate, comfortable environment, as well as the breathtaking views of the Golden Gate Bridge and the Marin Headlands, since 1958.</p><p>With state-of-the-art equipment, a Spinning studio, and a dedicated free weight room, Millberry Fitness &amp; Recreation Center offers something for everyone in an atmosphere that encourages and nurtures a sense of community.</p><h2 class="text-h4">Amenities</h2><ul><li>State-of-the-art equipment</li><li>Group fitness classes</li><li>Online class reservations</li><li>Basketball and squash courts</li><li>Locker rooms and saunas</li><li>Towel Service<br>&nbsp;</li></ul><h2 class="text-h4">Programs Offered</h2><ul><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/personal-training">Personal and Small Group Training</a></li><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/group-fitness">Group Fitness</a></li><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/recreational-sports">Drop-in and Rec Sports</a></li><li><a href="https://campuslifeserviceshome.ucsf.edu/fitnessrecreation/outdoor-programs">Outdoor</a> (Backpacking, Camping)</li></ul><p>&nbsp;</p><h2 class="text-h4">Class Schedule</h2><p><a href="/fitnessrecreation/schedules">View our Class Schedules page &gt;&gt;</a></p><h2 class="text-h4">Hours &amp; Location</h2><p>Facility Hours: Monday-Friday, 6:00 am-9:00 pm;&nbsp;Saturday-Sunday, 8:00 am-4:00 pm</p><p>Millberry Union<br><a href="https://www.google.com/maps/place/Millberry+Fitness+%26+Recreation+Center+at+UCSF+Parnassus/@37.763744,-122.4608264,17z/data=!3m2!4b1!5s0x80858759e0699515:0xf41274c8d1b322a1!4m6!3m5!1s0x80858759e09f025b:0xd6784592975f3733!8m2!3d37.763744!4d-122.4582515!16s%2Fg%2F11bxgtjr__?entry=ttu&amp;g_ep=EgoyMDI1MDcxNS4xIKXMDSoASAFQAw%3D%3D">500 Parnassus Avenue, Level B1</a><br>San Francisco, CA 94143</p><p><a href="https://campuslifeserviceshome.ucsf.edu/fitness-and-recreation/news/2026-fitness-and-recreation-holiday-schedule">2026 Holiday Hours</a></p><h2 class="text-h4">Parking &amp; Transportation</h2><p>Validated parking is offered during off-peak hours to Millberry Fitness &amp; Recreation members through UCSF Transportation Services.</p><p>Millberry Union Public Garage:<br>500 Parnassus Ave<br>(Enter on Parnassus Ave or 2nd &amp; Irving Street)</p><p>• Weekdays: $4 flat rate for up to 3 hours when you exit before 8:30 am and enter after 4:45 pm<br>• Weekends &amp; University Holidays: $4 flat rate for up to 3 hours any time</p><h2 class="text-h4">Membership</h2><p><a href="/fitnessrecreation/membership">Become a Member Today&nbsp;&gt;&gt;</a></p><h2 class="text-h4">Contact</h2><p><strong>Membership Inquiries:</strong> <a href="mailto:Member.services@ucsf.edu">Member.services@ucsf.edu</a> | 415.476.0348<br><br>If you're interested in cancelling a class or booking a court reservation, please contact our <strong>Service Desk:</strong> <a href="mailto:ucsf.fitness@ucsf.edu">ucsf.fitness@ucsf.edu</a> | 415.476.1115</p></div>
