[spots.mission-community-pool]
title = "Mission Community Pool"
slug = "mission-community-pool"
description_short = "La única piscina municipal al aire libre de San Francisco, abierta por temporada en el corazón de Mission."
body = "La única piscina municipal al aire libre de San Francisco. Construida en 1916, la piscina de 90 x 40 pies se ubica entre Linda y Valencia, en el corazón de Mission District, y opera por temporada de mayo a octubre. Los programas incluyen natación de carril, natación para mayores, natación recreativa, aeróbicos acuáticos y lecciones."

[spots.north-beach-pool]
title = "North Beach Pool"
slug = "north-beach-pool"
description_short = "Complejo cubierto con dos piscinas, sauna y programas desde natación familiar hasta clases para adultos."
body = "Complejo cubierto con dos piscinas: una piscina de carriles de 25 metros y 21 pies de profundidad, y una piscina recreativa de 89 pies, además de sauna y salones comunitarios. Los programas incluyen natación de carril, natación para mayores/terapia, ejercicio autoguiado, natación familiar y clases para aprender a nadar desde niños pequeños hasta adultos."

[spots.ocean-beach]
title = "Ocean Beach"
slug = "ocean-beach"
description_short = "Playa oceánica extensa y peligrosa; solo para nadadores experimentados de aguas abiertas y con condiciones tranquilas."
hazards = [ "corrientes de resaca potentes", "rompiente grande en la orilla", "olas inesperadas", "agua fría todo el año", "sin salvavidas fuera del horario designado" ]
body = "Ocean Beach se extiende por unas tres millas a lo largo del borde occidental de la ciudad. Es una de las playas más peligrosas de la costa de California: oleaje fuerte, corrientes de resaca potentes y olas inesperadas han causado numerosos ahogamientos. Nadar aquí es solo para nadadores experimentados de aguas abiertas, e incluso entonces solo con condiciones tranquilas."

