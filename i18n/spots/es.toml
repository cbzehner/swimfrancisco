access_notes = [ "La página de nado terapéutico indica solo carriles lentos y señala que el programa es para movimiento en agua tibia, recuperación y ejercicio suave." ]
access_summary = "La piscina terapéutica Herbst de Pomeroy es una piscina de agua tibia para terapia. Ofrece nado terapéutico, nado abierto, clases, lecciones y carriles lentos; no es una piscina de entrenamiento intenso de carriles."
description_short = "Mejor entendida como acceso a agua tibia para terapia, movimiento suave, lecciones y carriles lentos."
body = "Pomeroy se entiende mejor como acceso a agua tibia para terapia, movimiento suave, lecciones y natación lenta de carril, más que como una piscina estándar de carriles."

