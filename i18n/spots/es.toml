description_short = "Opción privada de piscina en downtown, con agua al aire libre y ambiente de club cerca del Embarcadero."
body = "Bay Club Gateway es la opción de piscina privada de downtown: agua al aire libre, instalaciones de fitness, tenis y un ambiente de club cerca del Embarcadero."

