description_short = "Piscina cubierta de seis carriles en Ingleside, reabierta tras una renovación importante."
body = "Piscina cubierta de 100 x 40 pies y seis carriles en el barrio de Ingleside, recientemente reabierta tras una renovación de $9 millones que agregó nuevos sistemas mecánicos, mejoras de accesibilidad y un mural del artista local Jason Jägel. Los programas incluyen natación de carril, natación para mayores, natación recreativa, clases de ejercicio acuático y lecciones."

