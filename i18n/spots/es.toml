[spots.baker-beach]
title = "Baker Beach"
slug = "baker-beach"
description_short = "Playa abierta al Pacífico con vistas al Golden Gate; el oleaje, el agua fría y las corrientes exigen mucha prudencia."
hazards = [ "corrientes de resaca", "rompiente fuerte en la orilla", "agua fría todo el año", "sin salvavidas" ]
body = "Baker Beach mira al Pacífico abierto justo al sur del Golden Gate, con vistas dramáticas del puente y los Marin Headlands. El oleaje, el agua fría y las corrientes de resaca la convierten en un entorno serio de aguas abiertas: los trajes de neopreno y los planes conservadores son la norma."

[spots.balboa-pool]
