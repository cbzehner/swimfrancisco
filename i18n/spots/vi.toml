access_summary = "Chinatown YMCA là chi nhánh YMCA dành cho hội viên, có hồ bơi nước mặn và các chương trình thủy sinh. Trang địa điểm chính thức công bố giờ mở cửa cơ sở, nhưng không có lịch bơi làn hoặc bơi mở cửa hằng tuần cụ thể trong nội dung tĩnh của trang."
description_short = "Lựa chọn hồ bơi hội viên gần Portsmouth Square và Financial District."
body = "Chinatown YMCA là lựa chọn hồ bơi hội viên gần Portsmouth Square và Financial District."

