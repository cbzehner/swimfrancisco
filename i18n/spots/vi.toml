body = "Hồ bơi trong nhà có nước ấm tại Hamilton Recreation Center, góc Geary và Steiner ở Lower Pacific Heights. Nơi này nổi bật vì có hai máng trượt nước trong nhà duy nhất trong hệ thống hồ bơi thành phố San Francisco. Chương trình gồm bơi theo làn, bơi cao niên, bơi giải trí và lớp học bơi."

