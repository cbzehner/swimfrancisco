[spots.china-beach]
title = "China Beach"
slug = "china-beach"
description_short = "Vịnh nhỏ dưới Sea Cliff, kín gió hơn Ocean hoặc Baker Beach nhưng vẫn là nước biển lạnh."
hazards = [ "dòng chảy xa bờ", "nước lạnh quanh năm", "chỉ có cứu hộ theo mùa" ]
