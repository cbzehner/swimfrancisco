slug = "mission-community-pool"
description_short = "Hồ bơi ngoài trời duy nhất do thành phố vận hành ở San Francisco, mở theo mùa trong trung tâm Mission."
body = "Hồ bơi ngoài trời duy nhất do thành phố vận hành ở San Francisco. Xây năm 1916, hồ 90 x 40 foot nằm giữa Linda và Valencia trong trung tâm Mission District và hoạt động theo mùa từ tháng 5 đến tháng 10. Chương trình gồm bơi theo làn, bơi cao niên, bơi giải trí, thể dục nhịp điệu dưới nước và lớp học bơi."

[spots.north-beach-pool]
title = "North Beach Pool"
slug = "north-beach-pool"
description_short = "Khu hồ trong nhà có hai hồ bơi, sauna và phòng cộng đồng, với chương trình từ bơi gia đình đến lớp người lớn."
body = "Khu trong nhà có hai hồ bơi: hồ bơi theo làn 25 mét, sâu 21 foot và hồ giải trí 89 foot, cùng sauna và phòng cộng đồng. Chương trình gồm bơi theo làn, bơi cao niên/trị liệu, tự tập, bơi gia đình và lớp học bơi cho trẻ nhỏ đến người lớn."

[spots.ocean-beach]
title = "Ocean Beach"
slug = "ocean-beach"
description_short = "Bãi biển dài và nguy hiểm; chỉ dành cho người bơi ngoài trời có kinh nghiệm khi điều kiện thật êm."
hazards = [ "dòng chảy xa bờ mạnh", "sóng vỡ lớn sát bờ", "sóng bất ngờ", "nước lạnh quanh năm", "không có cứu hộ ngoài giờ được chỉ định" ]
body = "Ocean Beach kéo dài khoảng ba dặm dọc rìa phía tây thành phố. Đây là một trong những bãi biển nguy hiểm nhất bờ biển California: sóng lớn, dòng chảy xa bờ mạnh và sóng bất ngờ đã gây nhiều vụ đuối nước. Bơi ở đây chỉ dành cho người bơi ngoài trời có kinh nghiệm, và ngay cả vậy cũng chỉ nên bơi khi điều kiện êm."

[spots.pomeroy-pool]
title = "Pomeroy Pool"
slug = "pomeroy-pool"
access_notes = [ "Trang bơi trị liệu ghi chỉ bơi làn chậm và cho biết chương trình dành cho vận động trong nước ấm, phục hồi và tập nhẹ." ]
access_summary = "Hồ trị liệu Herbst của Pomeroy là hồ nước ấm dành cho trị liệu. Hồ có bơi trị liệu, bơi mở cửa, lớp học, bài học và bơi làn chậm; đây không phải là hồ để tập luyện bơi làn cường độ cao."
description_short = "Phù hợp hơn như nước ấm cho trị liệu, vận động nhẹ, lớp học và bơi làn chậm."
body = "Pomeroy nên được xem là nơi tiếp cận nước ấm cho trị liệu, vận động nhẹ, lớp học và bơi làn chậm hơn là một hồ bơi làn tiêu chuẩn."

