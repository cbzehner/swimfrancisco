[spots.aquatic-park]
title = "Aquatic Park"
slug = "aquatic-park"
access_notes = [ "Quyền vào câu lạc bộ tách biệt với việc bơi trong vịnh công cộng.", "Nếu bạn mới bơi trong vịnh, hãy liên hệ một câu lạc bộ hoặc người bơi địa phương có kinh nghiệm trước khi đi một mình." ]
access_summary = "Vịnh nhỏ và bãi biển Aquatic Park là không gian công cộng và miễn phí. Nhà câu lạc bộ South End và Dolphin là các câu lạc bộ tình nguyện riêng; hãy dùng quy trình khách hoặc hội viên của từng câu lạc bộ để sử dụng vòi sen, tủ đồ, sauna và hoạt động do câu lạc bộ tổ chức."
common_distances = [ "0,25 dặm đến đê chắn sóng", "vòng 1 dặm" ]
description_short = "Vịnh nhỏ được che chắn ở khu bờ nước phía bắc, nước tương đối êm và có các câu lạc bộ bơi lâu đời trên bãi."
hazards = [ "tàu thuyền ngoài vịnh nhỏ", "nước lạnh quanh năm" ]
body = "Aquatic Park là một vịnh nhỏ được che chắn ở khu bờ nước phía bắc, được bảo vệ bởi cầu tàu thành phố dạng cong. Điều kiện nước êm quanh năm khiến nơi này trở thành điểm tập bơi ngoài trời quen thuộc của thành phố. [South End Rowing Club](https://serc.com/) và [Dolphin Club](https://dolphinclub.org/) đều có nhà câu lạc bộ trên bãi và tổ chức các buổi bơi thường xuyên."

