[spots.baker-beach]
title = "Baker Beach"
slug = "baker-beach"
description_short = "Bãi biển hướng ra Thái Bình Dương với cảnh Golden Gate; sóng, nước lạnh và dòng chảy xa bờ cần kế hoạch thận trọng."
hazards = [ "dòng chảy xa bờ", "sóng vỡ lớn sát bờ", "nước lạnh quanh năm", "không có cứu hộ" ]
body = "Baker Beach hướng ra Thái Bình Dương ngay phía nam Golden Gate, với cảnh nhìn ấn tượng ra cây cầu và Marin Headlands. Sóng, nước lạnh và dòng chảy xa bờ khiến đây là môi trường bơi ngoài trời nghiêm túc: đồ bơi giữ nhiệt và kế hoạch bơi thận trọng là điều nên có."

[spots.balboa-pool]
title = "Balboa Pool"
slug = "balboa-pool"
description_short = "Hồ bơi trong nhà sáu làn ở Ingleside, vừa mở lại sau một đợt cải tạo lớn."
body = "Hồ bơi trong nhà 100 x 40 foot, sáu làn ở khu Ingleside, vừa mở lại sau dự án cải tạo 9 triệu đô la với hệ thống cơ khí mới, nâng cấp tiếp cận và tranh tường của nghệ sĩ địa phương Jason Jägel. Chương trình gồm bơi theo làn, bơi cao niên, bơi giải trí, lớp thể dục và vận động, và lớp học bơi."

[spots.bay-club-gateway]
title = "Bay Club Gateway"
slug = "bay-club-gateway"
access_notes = [ "Kiểm tra trang chính thức của câu lạc bộ hoặc lịch lớp trước khi đi; Swim Francisco chưa công bố tình trạng làn bơi tại đây." ]
access_summary = "Bay Club Gateway là câu lạc bộ tư nhân trong khu San Francisco Campus, có trung tâm thủy sinh ngoài trời và hai hồ bơi nước ấm. Quyền vào phụ thuộc vào hội viên Bay Club, đặc quyền khách mời hoặc một buổi tham quan đã lên lịch."
description_short = "Lựa chọn hồ bơi tư nhân ở downtown, có nước ngoài trời và không gian câu lạc bộ gần Embarcadero."
body = "Bay Club Gateway là lựa chọn hồ bơi tư nhân ở downtown: hồ ngoài trời, cơ sở fitness, tennis và không gian câu lạc bộ gần Embarcadero."

