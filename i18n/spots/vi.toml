description_short = "Điểm vào nước từ cát ở phía vịnh của Presidio, có cảnh cầu đẹp nhưng thủy triều gần Golden Gate đổi nhanh."
hazards = [ "dòng thủy triều mạnh", "nước lạnh quanh năm", "tàu thuyền và tàu lớn qua lại" ]
