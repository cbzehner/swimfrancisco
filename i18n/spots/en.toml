[spots.aquatic-park]
title = "Aquatic Park"
slug = "aquatic-park"
access_notes = [ "Club access is separate from swimming in the public cove.", "If you are new to bay swimming, connect with a club or experienced local swimmer before going alone." ]
access_summary = "The Aquatic Park cove and beach are public and free. The South End and Dolphin clubhouses are separate volunteer clubs; use each club's visitor or membership process for showers, lockers, sauna, and organized club activities."
common_distances = [ "0.25mi to breakwater", "1mi loop" ]
description_short = "Protected cove, calm water, popular with swim clubs"
hazards = [ "boat traffic outside cove", "cold water year-round" ]
body = "Aquatic Park is a protected cove on the northern waterfront, sheltered by a curved municipal pier. Calm conditions year-round make it the go-to open water training ground in the city. The [South End Rowing Club](https://serc.com/) and [Dolphin Club](https://dolphinclub.org/) both occupy clubhouses on the beach and run regular swims."

