fee = "$12 cash/check or $12.67 card"
note = "No public day-use on federal or state holidays. Day-use covers locker rooms, shower, sauna, deck, and lounge; boats are not available to non-members."
source_url = "https://dolphinclub.org/swimming/"

[[spots.aquatic-park.pricing]]
