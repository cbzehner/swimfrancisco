fee = "$12 day-use"
note = "Public day-use is available Tuesday, Thursday, and Saturday with seasonal hours. Follow SERC's public day-use requirements before using the clubhouse."
source_url = "https://serc.com/faq"

[[spots.aquatic-park.clubs]]
