body = "Ang Aquatic Park ay protektadong look sa hilagang tabing-tubig, sinasalag ng kurbadong pier ng lungsod. Dahil kalmado ang kondisyon buong taon, ito ang pangunahing lugar sa lungsod para magsanay sa bukas na tubig. Parehong may clubhouse sa dalampasigan ang [South End Rowing Club](https://serc.com/) at [Dolphin Club](https://dolphinclub.org/), at regular silang nag-oorganisa ng paglangoy."

