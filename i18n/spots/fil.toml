access_summary = "Publiko at libre ang look at dalampasigan ng Aquatic Park. Hiwalay na boluntaryong samahan ang mga clubhouse ng South End at Dolphin; gamitin ang proseso ng bawat samahan para sa bisita o pagiging miyembro kung kailangan mo ng shower, locker, sauna, at organisadong aktibidad ng club."
