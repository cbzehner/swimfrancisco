description_short = "Tanging panlabas na pool na pinatatakbo ng lungsod sa San Francisco, bukas ayon sa panahon sa puso ng Mission."
body = "Ang tanging panlabas na pool na pinatatakbo ng lungsod sa San Francisco. Itinayo noong 1916, ang 90 x 40 talampakang pool ay nasa pagitan ng Linda at Valencia streets sa puso ng Mission District at bukas ayon sa panahon mula Mayo hanggang Oktubre. Kasama sa mga programa ang paglangoy sa lane, paglangoy para sa nakatatanda, pampamilyang paglangoy, aerobics sa tubig, at mga aralin."

[spots.north-beach-pool]
title = "North Beach Pool"
slug = "north-beach-pool"
description_short = "Panloob na complex na may dalawang pool, sauna, silid para sa komunidad, at mga programa mula pampamilyang paglangoy hanggang aralin para sa adults."
body = "Panloob na complex na may dalawang pool: 25-meter na pool para sa paglangoy sa lane na 21 talampakan ang lalim, at 89-foot na pool para sa libangang paglangoy, kasama ang sauna at mga silid para sa komunidad. Kasama sa mga programa ang paglangoy sa lane, paglangoy para sa nakatatanda o terapiya, self-guided na ehersisyo, pampamilyang paglangoy, at mga aralin sa paglangoy para sa maliliit na bata hanggang adults."

[spots.ocean-beach]
title = "Ocean Beach"
slug = "ocean-beach"
description_short = "Mahaba at mapanganib na dalampasigan sa karagatan; para lang sa bihasang manlalangoy sa bukas na tubig kapag kalmado ang kondisyon."
hazards = [ "malalakas na agos pabalik sa dagat", "malaking bagsak ng alon sa baybayin", "biglaang malalaking alon", "malamig ang tubig buong taon", "walang tagapagligtas sa labas ng itinakdang oras" ]
body = "Umaabot nang halos tatlong milya ang Ocean Beach sa kanlurang gilid ng lungsod. Isa ito sa pinakamapanganib na dalampasigan sa baybayin ng California: malalakas na alon, makapangyarihang agos pabalik sa dagat, at biglaang malalaking alon ang naging sanhi ng maraming pagkalunod. Ang paglangoy dito ay para lamang sa bihasang manlalangoy sa bukas na tubig, at kahit ganoon ay kapag kalmado lang ang kondisyon."

[spots.pomeroy-pool]
title = "Pomeroy Pool"
slug = "pomeroy-pool"
access_notes = [ "Sinasabi ng pahina ng paglangoy pang-terapiya na mabagal na paglangoy sa lane lamang, at binabanggit na ang programa ay para sa galaw sa mainit-init na tubig, pag-recover, at banayad na ehersisyo." ]
access_summary = "Ang Herbst Therapeutic Pool ng Pomeroy ay terapewtikong pool na may mainit-init na tubig. Nag-aalok ito ng paglangoy para sa terapiya, bukas na paglangoy, mga klase, mga aralin, at mabagal na paglangoy sa lane; hindi ito pool para sa matinding pagsasanay sa paglangoy sa lane."
description_short = "Mas angkop na mainit-init na tubig para sa terapiya, banayad na galaw, mga aralin, at mabagal na paglangoy sa lane."
body = "Mas mainam ituring ang Pomeroy bilang mainit-init na tubig para sa terapiya, banayad na galaw, mga aralin, at mabagal na paglangoy sa lane kaysa bilang karaniwang lap pool."

