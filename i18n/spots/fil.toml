[spots.baker-beach]
title = "Baker Beach"
slug = "baker-beach"
description_short = "Dalampasigang nakaharap sa bukas na Pacific na may tanaw sa Golden Gate; seryoso ang alon, lamig, at malakas na agos pabalik sa dagat."
hazards = [ "malakas na agos pabalik sa dagat", "malaking bagsak ng alon sa baybayin", "malamig ang tubig buong taon", "walang tagapagligtas" ]
body = "Nakaharap ang Baker Beach sa bukas na Pacific sa timog lang ng Golden Gate, na may dramatikong tanaw sa tulay at Marin Headlands. Dahil sa alon, malamig na tubig, at malakas na agos pabalik sa dagat, seryosong kapaligiran ito para sa paglangoy sa bukas na tubig: karaniwan ang wetsuit at maingat na plano sa paglangoy."

[spots.balboa-pool]
title = "Balboa Pool"
slug = "balboa-pool"
description_short = "Palanguyang panloob na may anim na lane sa Ingleside, muling binuksan pagkatapos ng malaking pagkukumpuni."
body = "Isang 100 x 40 talampakang palanguyang panloob na may anim na lane sa Ingleside, kamakailang muling binuksan pagkatapos ng $9M na pagkukumpuni na nagdagdag ng bagong mekanikal na sistema, mga pagpapahusay sa accessibility, at mural ng lokal na artist na si Jason Jägel. Kasama sa mga programa ang paglangoy sa lane, paglangoy para sa nakatatanda, pampamilyang paglangoy, fitness at ehersisyo, at mga aralin."

