[spots.china-beach]
title = "China Beach"
slug = "china-beach"
description_short = "Maliit na cove sa ilalim ng Sea Cliff, mas protektado kaysa Ocean o Baker Beach pero malamig pa rin ang tubig-dagat."
hazards = [ "malakas na agos pabalik sa dagat", "malamig ang tubig buong taon", "may tagapagligtas lang sa panahon ng season" ]
body = "Ang China Beach ay maliit na pocket cove sa ilalim ng Sea Cliff neighborhood, sa pagitan ng Baker Beach at Lands End. Dahil may headlands sa magkabilang gilid, mas banayad ang surf dito kaysa Ocean o Baker Beach, pero ocean water pa rin ito na may malakas na agos pabalik sa dagat at malamig na temperatura."

